    put:
      tags:
      - Approval Requests
      summary: Update NLB index
      description: Manually override the NLB index for a single resource (by resourceId)
        of the latest PENDING IDC approval request
      operationId: updateNlbIndices
      parameters:
      - name: targetSourceId
        in: path
        description: Target source ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NlbIndexAssignmentDto"
        required: true
      responses:
        "400":
          description: "Target source is not IDC, or the NLB index is invalid"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Approval request is not PENDING
          content:
