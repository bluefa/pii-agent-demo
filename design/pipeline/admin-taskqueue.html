<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Task Queue — PII Admin</title>
<style>
/* ══ Admin Task Queue 프로토타입 (r2) ══
   상속: admin-pipeline.html variant B (다크 크롬 + 라이트 캔버스) — 토큰·컨트롤 3단(32/28/20)·
   타입 스케일 {12,14,16,20,24,32}·간격 {4,8,12,16,24,64}.
   리소스·연결테스트 테이블은 앱 구현(SIT Prototype Athena v16)의 db-list-table 문법을 따른다:
   hover 행, 제외행 회색, tag 팔레트, pagination-row, conn-progress. */
:root{
  --gray-50:#F9FAFB; --gray-100:#F2F4F7; --gray-200:#E4E7EC; --gray-300:#D0D5DD;
  --gray-400:#98A2B3; --gray-500:#667085; --gray-600:#475467; --gray-700:#344054;
  --gray-800:#1D2939; --gray-900:#101828;
  --bg-page:#F9FAFB; --bg-card:#FFFFFF; --bg-inner:#F9FAFB;
  --border:#E4E7EC; --border-strong:#D0D5DD;
  --text-strong:var(--gray-900); --text-medium:var(--gray-700);
  --text-weak:var(--gray-500); --text-faint:var(--gray-400);
  --primary:#2563EB; --primary-hover:#1D4ED8; --primary-bg:#EFF4FF; --primary-ring:#D1E0FF;
  --ok:#12B76A; --ok-text:#027A48; --ok-bg:#ECFDF3; --ok-border:#A6F4C5;
  --err:#F04438; --err-text:#B42318; --err-bg:#FEF3F2; --err-border:#FDA29B;
  --info:#2E90FA; --info-text:#175CD3; --info-bg:#EFF8FF; --info-border:#B2DDFF;
  --warn:#F79009; --warn-text:#B54708; --warn-bg:#FFFAEB; --warn-border:#FEDF89;
  --off:#98A2B3; --off-text:#475467; --off-bg:#F2F4F7;
  --err-solid:#D92D20; --err-solid-hover:#B42318;
  --pv-aws:#EC7211; --pv-azure:#0078D4; --pv-gcp:#4285F4; --pv-idc:#344054; --pv-sdu:#7F56D9;
  --white:#FFFFFF;
  --r-card:10px; --r-inner:8px; --r-ctl:8px;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 32px -8px rgba(16,24,40,.16),0 4px 10px -4px rgba(16,24,40,.08);
  --font-sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-strong);
  font-family:var(--font-sans);font-size:14px;letter-spacing:-0.014em;line-height:1.4;
  -webkit-font-smoothing:antialiased;min-width:1080px}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
svg.ic.sm{width:14px;height:14px;vertical-align:-2px}
svg.ic.xs{width:12px;height:12px;vertical-align:-1px}

.meta{font-size:12px;font-weight:400;color:var(--text-weak);line-height:1.4}
.mono{font-family:var(--font-mono);font-size:12px;color:var(--text-strong)}
.link{color:var(--primary);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}
.muted{color:var(--text-weak)}
.mt-16{margin-top:16px}.mt-12{margin-top:12px}

/* ── App shell ── */
.topnav{height:52px;background:#101828;border-bottom:1px solid #101828;
  display:flex;align-items:stretch;gap:4px;padding:0 24px;position:sticky;top:0;z-index:20}
.topnav .brand{color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;margin-right:20px}
.topnav .brand::before{content:"";width:20px;height:20px;border-radius:6px;flex:none;
  background:linear-gradient(135deg,var(--primary),#7F56D9)}
.topnav .nav-item{color:#98A2B3;font-size:14px;font-weight:500;display:flex;align-items:center;
  padding:0 12px;border-bottom:2px solid transparent;cursor:default}
.topnav .nav-item.active{color:#fff;font-weight:600;border-bottom-color:var(--primary)}
.topnav .nav-item.off{opacity:.5}
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:216px;flex:none;background:#101828;border-right:1px solid #101828;padding:16px 12px}
.sidebar .sb-title{font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:8px 10px 10px;color:#667085}
.sidebar .sb-group+.sb-title{margin-top:16px}
.sidebar .sb-item{display:block;padding:7px 10px;border-radius:6px;color:#B9C0CC;
  font-size:14px;font-weight:500;cursor:pointer;margin-bottom:2px}
.sidebar .sb-item:hover{background:#1D2939}
.sidebar .sb-item.active{background:#1D2939;color:#fff;font-weight:600;
  box-shadow:inset 2px 0 0 var(--primary)}
.content{flex:1;padding:24px 32px 48px;min-width:0;max-width:1440px}
.breadcrumb{font-size:12px;color:var(--text-weak);margin-bottom:12px}
.breadcrumb .crumb{cursor:pointer}
.breadcrumb .crumb:hover{color:var(--text-medium);text-decoration:underline}
.breadcrumb .sep{margin:0 6px;color:var(--text-faint)}
.breadcrumb .cur{color:var(--text-medium);font-weight:600}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-head h1{font-size:24px;font-weight:700;margin:0;line-height:1.2;letter-spacing:-.02em}
.page-head .head-sub{display:flex;align-items:center;gap:8px;margin-top:8px}
.page-head .actions{display:flex;gap:8px}
.section-title{font-size:20px;font-weight:600;color:var(--text-strong);margin:64px 0 12px;line-height:1.2}
.section-title:first-child{margin-top:0}
.section-desc{font-size:12px;font-weight:400;color:var(--text-weak);line-height:1.4;margin:16px 0 16px}
.subsection-title{font-size:14px;font-weight:600;color:var(--text-medium);margin:16px 0 10px}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-card);
  box-shadow:var(--shadow-xs);padding:20px 24px 24px}
.card+.card{margin-top:16px}

/* ── Stat (회색 타일 = 읽기 전용 요약 · 가운데 정렬) ── */
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,260px));gap:12px}
.stat{background:var(--gray-100);border:1px solid var(--border);border-radius:var(--r-card);
  padding:20px 24px 24px;text-align:center}
.stat .lbl{font-size:14px;font-weight:600;color:var(--text-medium)}
.stat .val{font-size:32px;font-weight:600;margin-top:12px;line-height:1.2;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .val.v-err{color:var(--err-text)}
.stat .val.v-warn{color:var(--warn-text)}

/* ── 요약 테이블 (모니터·목록 — admin-pipeline 리듬 th34/td44) ── */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--text-weak);letter-spacing:.03em;
  height:34px;padding:0 12px;border-bottom:1px solid var(--border)}
.tbl td{height:44px;padding:8px 12px;border-bottom:1px solid var(--gray-100);color:var(--text-medium);
  vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--gray-50)}
.tbl .mono{font-family:var(--font-mono);font-size:12px;color:var(--text-strong)}
.tbl td.chev{text-align:right;width:48px;white-space:nowrap}
tr.click:hover .btn.round{border-color:var(--primary);color:var(--primary)}
.svc-name{font-weight:600;color:var(--text-strong)}

/* ── 리소스 테이블 (앱 db-list-table 문법: hover·제외행·tag) ── */
.res-wrap{border:1px solid var(--border);border-radius:10px 10px 0 0;overflow:hidden}
.res-tbl{width:100%;border-collapse:collapse;font-size:14px}
.res-tbl thead{background:var(--gray-50)}
.res-tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--text-weak);
  padding:12px 16px;border-bottom:1px solid var(--border)}
.res-tbl td{padding:13px 16px;border-top:1px solid var(--gray-100);color:var(--text-medium);
  vertical-align:middle;font-variant-numeric:tabular-nums}
.res-tbl tbody tr:first-child td{border-top:0}
.res-tbl tbody tr{transition:background .12s}
.res-tbl tbody tr:hover td{background:var(--bg-inner)}
.res-tbl tbody tr.row-excluded td{background:var(--gray-100);color:var(--text-weak)}
.res-tbl tbody tr.row-excluded:hover td{background:var(--gray-200)}
.res-tbl .mono{font-family:var(--font-mono);font-size:12px;color:var(--text-strong)}
.res-tbl tr.row-excluded .mono{color:var(--text-weak)}
.target-yes{color:var(--ok-text);font-weight:600;white-space:nowrap}
.target-no{color:var(--text-weak);font-weight:600;white-space:nowrap}
.res-id-cell{display:inline-flex;align-items:center;gap:6px;max-width:100%}
.res-id-text{font-family:var(--font-mono);font-size:12px;color:var(--text-strong);
  max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.row-excluded .res-id-text{color:var(--text-weak)}
.copy-btn{display:inline-grid;place-items:center;width:22px;height:22px;border:0;background:transparent;
  border-radius:5px;color:var(--text-faint);cursor:pointer;flex:none}
.copy-btn:hover{background:var(--gray-100);color:var(--text-medium)}
.res-tbl .ldb-link{color:var(--primary);cursor:pointer;font-weight:600}
.res-tbl .ldb-link:hover{text-decoration:underline}
.stx{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px}
.stx-step{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text-weak)}

/* ── Tag (앱 문법: dbtype=blue, 상태=green/red/orange) ── */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  padding:2px 8px;border-radius:6px;vertical-align:middle}
.tag.blue{background:#E8F1FF;color:#1747B5}
.tag.gray{background:var(--gray-100);color:var(--text-medium)}
.tag.green{background:var(--ok-bg);color:var(--ok-text)}
.tag.red{background:var(--err-bg);color:var(--err-text)}
.tag.orange{background:var(--warn-bg);color:var(--warn-text)}
tr.row-excluded .tag.blue{background:var(--gray-200);color:var(--text-weak)}

/* ── Pagination (앱 pagination-row 문법) ── */
.pagination-row{display:flex;align-items:center;padding:10px 14px;border:1px solid var(--border);
  border-top:none;border-radius:0 0 10px 10px;background:#FCFCFD;font-size:12px;color:var(--text-weak)}
.pg-perpage{display:inline-flex;align-items:center;gap:6px}
.pg-perpage select{height:26px;border:1px solid var(--border-strong);border-radius:6px;padding:0 8px;
  font-size:12px;background:var(--bg-card);color:var(--text-strong);cursor:pointer}
.pg-info{margin-left:16px;color:var(--text-medium);font-variant-numeric:tabular-nums}
.pg-info strong{color:var(--text-strong)}
.pg-spacer{flex:1}
.pg-pages{display:inline-flex;align-items:center;gap:4px}
.pg-pages button{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;
  border:1px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text-medium);
  font-size:12px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.pg-pages button:hover:not(:disabled):not(.current){border-color:var(--border-strong);background:var(--gray-50)}
.pg-pages button.current{background:var(--gray-900);border-color:var(--gray-900);color:#fff;cursor:default}
.pg-pages button:disabled{opacity:.4;cursor:not-allowed}

/* ── Pills / provider tag ── */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  height:20px;padding:0 9px 0 8px;border-radius:999px;letter-spacing:.02em}
.pill .dot{width:6px;height:6px;border-radius:50%}
.pill.t-off{background:var(--off-bg);color:var(--off-text)} .pill.t-off .dot{background:var(--gray-300)}
.pill.t-warn{background:var(--warn-bg);color:var(--warn-text)} .pill.t-warn .dot{background:var(--warn)}
.pill.t-info{background:var(--info-bg);color:var(--info-text)} .pill.t-info .dot{background:var(--info)}
.pill.t-run{background:var(--info-bg);color:var(--info-text)} .pill.t-run .dot{background:var(--info);animation:pulse 1.6s ease-in-out infinite}
.pill.t-ready{background:var(--primary-bg);color:var(--primary)} .pill.t-ready .dot{background:var(--primary)}
.pill.t-ok{background:var(--ok-bg);color:var(--ok-text)} .pill.t-ok .dot{background:var(--ok)}
.pill.t-err{background:var(--err-bg);color:var(--err-text)} .pill.t-err .dot{background:var(--err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ptag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-medium)}
.ptag .pdot{width:8px;height:8px;border-radius:2.5px}

/* ── KeyValueGrid ── */
.kv2{display:grid;grid-template-columns:130px 1fr 130px 1fr;gap:10px 16px;font-size:14px}
.kv2 .k{font-size:12px;font-weight:600;color:var(--text-weak);line-height:1.4}
.kv2 .v{color:var(--text-strong);font-weight:500;line-height:1.4}

/* ── Controls ── */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filterbar .spacer{flex:1}
.searchbox{position:relative;display:inline-block}
.searchbox svg.ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;
  color:var(--text-faint);pointer-events:none}
.searchbox .input{padding-left:30px;width:100%}
.input,select.sel{height:32px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);padding:0 10px;
  font-size:14px;font-family:inherit;color:var(--text-strong);background:var(--bg-card);outline:none}
.input:focus,select.sel:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
select.sel.sm{height:28px;font-size:12px;border-radius:6px}
select.sel.sm.dirty{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.seg{display:inline-flex;background:var(--gray-100);border-radius:var(--r-ctl);padding:2px}
.seg button{border:0;background:transparent;height:28px;padding:0 12px;border-radius:6px;font-size:12px;
  font-weight:600;color:var(--text-weak);cursor:pointer}
.seg button.on{background:var(--bg-card);color:var(--text-strong);box-shadow:var(--shadow-xs)}
.seg button .cnt{font-weight:400;color:var(--text-faint);margin-left:4px;font-variant-numeric:tabular-nums}
.seg button.on .cnt{color:var(--text-weak)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;
  border-radius:var(--r-ctl);font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;
  transition:background .12s,border-color .12s,color .12s}
.btn:disabled{cursor:not-allowed}
.btn.primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-xs)}
.btn.primary:not(:disabled):hover{background:var(--primary-hover)}
.btn.primary:disabled{background:var(--gray-100);color:var(--text-faint);box-shadow:none}
.btn.secondary{background:var(--bg-card);color:var(--text-medium);border-color:var(--border-strong);box-shadow:var(--shadow-xs)}
.btn.secondary:not(:disabled):hover{background:var(--gray-50)}
.btn.danger{background:var(--bg-card);color:var(--err-text);border-color:var(--err-border);box-shadow:var(--shadow-xs)}
.btn.danger:not(:disabled):hover{background:var(--err-bg)}
.btn.dangersolid{background:var(--err-solid);color:#fff;box-shadow:var(--shadow-xs)}
.btn.dangersolid:not(:disabled):hover{background:var(--err-solid-hover)}
.btn.dangersolid:disabled{background:var(--gray-100);color:var(--text-faint);box-shadow:none}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.round{width:28px;padding:0;border-radius:999px}

/* ── conn-progress (앱 Step5 문법) ── */
.conn-progress{background:var(--bg-inner);border:1px solid var(--border);border-radius:var(--r-inner);
  padding:13px 16px 14px;margin-bottom:16px}
.conn-progress.cp-ok{background:var(--ok-bg);border-color:var(--ok-border)}
.conn-progress.cp-fail{background:var(--err-bg);border-color:var(--err-border)}
.cp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
.cp-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text-strong)}
.cp-icon{display:inline-grid;place-items:center;width:18px;height:18px;color:var(--text-weak);flex:none}
.cp-ok .cp-icon{color:var(--ok-text)} .cp-fail .cp-icon{color:var(--err-text)}
.cp-meta{display:flex;align-items:center;gap:14px}
.cp-counts{font-size:12px;color:var(--text-weak);font-weight:500;font-variant-numeric:tabular-nums}
.cp-counts b{font-weight:700}
.cp-counts .c-ok{color:var(--ok-text)} .cp-counts .c-fail{color:var(--err-text)}
.cp-pct{font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--text-weak);
  font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.cp-ok .cp-pct{color:var(--ok-text)} .cp-fail .cp-pct{color:var(--err-text)}
.cp-track{height:6px;border-radius:999px;background:var(--gray-200);overflow:hidden}
.cp-fill{height:100%;border-radius:999px;background:var(--gray-400)}
.cp-ok .cp-fill{background:var(--ok)} .cp-fail .cp-fill{background:var(--err)}

/* ── NLB 점유 막대 ── */
.occbar{position:relative;width:96px;height:6px;border-radius:999px;background:var(--gray-200);overflow:hidden;display:inline-block;vertical-align:middle}
.occbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--gray-400)}
.occbar.warn i{background:var(--warn)}
.occbar.err i{background:var(--err)}
.occ-num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text-strong)}
.occ-num .den{color:var(--text-faint);font-weight:500}
.ftag{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;
  padding:1px 6px;border-radius:4px;vertical-align:middle;white-space:nowrap}
.ftag.warn{background:var(--warn-bg);color:var(--warn-text)}
.ftag.err{background:var(--err-bg);color:var(--err-text)}
.ftag.ok{background:var(--ok-bg);color:var(--ok-text)}
.ftag.na{background:var(--off-bg);color:var(--text-weak)}

/* ── 지연 표기 ── */
.delay{font-variant-numeric:tabular-nums;font-weight:500}
.delay.warn{color:var(--warn-text);font-weight:600}
.delay.err{color:var(--err-text);font-weight:600}

/* ── Modal / Toast / 툴팁 ── */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg-card);border-radius:12px;box-shadow:var(--shadow-lg);padding:24px;width:480px}
.modal.wide{width:760px;max-height:82vh;display:flex;flex-direction:column}
.modal.wide .modal-body{overflow-y:auto;min-height:0}
.modal h3{margin:0 0 12px;font-size:16px;font-weight:700}
.modal .desc{font-size:14px;color:var(--text-medium);margin-bottom:14px;line-height:1.4}
.modal textarea{width:100%;min-height:88px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);
  padding:8px 10px;font-size:14px;font-family:inherit;resize:vertical;outline:none;line-height:1.4}
.modal textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* ── 승인·반려 모달 (앱 모달 문법: 헤더 eyebrow+제목+서브 / 본문 폼 섹션 / border-top 푸터)
   계층: 오버라인(컨텍스트 weak · 식별자 primary) → 타이틀 32 → 서브 24 → 메타/폼 ── */
.modal.app{width:720px;padding:0;border-radius:20px;overflow-y:auto;max-height:88vh}
.am-header{padding:36px 40px 4px}
.am-eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);
  font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-bottom:12px}
.am-eyebrow::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--primary)}
.am-eyebrow .ey-ctx{color:var(--text-weak)}
.am-eyebrow .ey-sep{color:var(--text-faint)}

function humanDelay(sec){
  if(sec<60) return sec+'초';
  if(sec<3600) return Math.floor(sec/60)+'분';
  if(sec<86400){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return m?`${h}시간 ${m}분`:`${h}시간`;}
  const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600);return h?`${d}일 ${h}시간`:`${d}일`;
}

function pslice(arr,key){
  const st=PG[key], pages=Math.max(1,Math.ceil(arr.length/st.size));
  if(st.page>pages) st.page=pages;
  return arr.slice((st.page-1)*st.size, st.page*st.size);
}
function pagerHtml(key,total){
  const st=PG[key], pages=Math.max(1,Math.ceil(total/st.size));
  const a=total?((st.page-1)*st.size+1):0, b=Math.min(total,st.page*st.size);
  let nums=''; const win=5, s=Math.max(1,Math.min(st.page-2,pages-win+1)), e=Math.min(pages,s+win-1);
  for(let p=s;p<=e;p++) nums+=`<button ${p===st.page?'class="current"':`data-pg="${key}:${p}"`}>${p}</button>`;
  return `<div class="pagination-row">
    <div class="pg-perpage"><span>표시</span>
      <select data-pgsize="${key}">${[10,20,50].map(n=>`<option${n===st.size?' selected':''}>${n}</option>`).join('')}</select>
      <span>건씩</span></div>
    <span class="pg-info"><strong>${a}–${b}</strong> / 전체 <strong>${total}</strong>건</span>
    <div class="pg-spacer"></div>
    <div class="pg-pages">
      <button data-pg="${key}:${st.page-1}" ${st.page<=1?'disabled':''} aria-label="이전"><svg class="ic xs"><use href="#i-chev-l"/></svg></button>
      ${nums}
      <button data-pg="${key}:${st.page+1}" ${st.page>=pages?'disabled':''} aria-label="다음"><svg class="ic xs"><use href="#i-chev-r"/></svg></button>
    </div></div>`;
}

history.scrollRestoration='manual';
function nav(h){location.hash=h;}
window.addEventListener('hashchange',render);
window.addEventListener('DOMContentLoaded',()=>{if(!location.hash)location.hash='#/queue';render();});

function render(){
  const h=location.hash||'#/queue';
  closeModal();
  const mReq=h.match(/^#\/requests\/(\d+)/), mTc=h.match(/^#\/tc\/(\d+)/);
  let page, active;
  if(mReq){page=renderDetail(+mReq[1]); active='#/requests';}
  else if(h.startsWith('#/requests')){page=renderRequests(); active='#/requests';}
  else if(mTc){page=renderTcDetail(+mTc[1]); active='#/tc';}
  else if(h.startsWith('#/tc')){page=renderTc(); active='#/tc';}
  else {page=renderQueue(); active='#/queue';}
  $('#content').innerHTML=page;
  document.querySelectorAll('#sidebar .sb-item[data-nav]').forEach(n=>{
    n.classList.toggle('active',n.getAttribute('data-nav')===active);
    n.onclick=()=>nav(n.getAttribute('data-nav'));
  });
  bindPage();
  window.scrollTo(0,0);
}

    <span class="crumb" data-nav="#/queue">Task Queue</span><span class="sep">/</span>
    <span class="crumb" data-nav="#/tc">연결 테스트</span><span class="sep">/</span>
    <span class="cur">${esc(d.svc)} #${ts}</span>
  </div>
  <div class="page-head">
    <div>
      <h1>${esc(d.svc)} <span class="muted" style="font-weight:500">#${ts}</span></h1>
      <div class="head-sub">${ptag(d.pv)}<span class="mono">${d.code}</span>
        ${isDone?'<span class="pill t-ok"><span class="dot"></span>연결 테스트 완료</span>':'<span class="pill t-err"><span class="dot"></span>재실행 요청</span>'}</div>
    </div>
    ${isDone?`<div class="actions">
      <button class="btn danger" id="tc-rerun">연결 테스트 재실행 요청</button>
      <button class="btn primary" id="tc-confirm">연동 승인</button>
    </div>`:''}
  </div>

  <div class="section-title">연결 테스트 결과</div>
  <div class="section-desc">${isDone
    ?`완료 일자 ${d.completed_at} · 연동 대상 논리 DB ${incTotal}개 · 제외 논리 DB ${excTotal}개`
    :`반려 일자 ${d.rejected_at} · 서비스에 재실행을 요청한 상태예요`}</div>
  <div class="card">
    ${isDone?'':`
    <div class="reject-box">
      <svg class="ic"><use href="#i-alert"/></svg>
      <div>
        <div class="rb-title">재실행 요청 사유</div>
        <div class="rb-body">${esc(d.reason)}</div>
        <div class="rb-meta">반려 일자 ${d.rejected_at}</div>
      </div>
    </div>`}
    <div class="res-wrap">
    <table class="res-tbl">
      ${isIdc?`
      <thead><tr>
        <th style="width:66px">구분</th><th style="width:104px">Database Type</th><th>연동 대상</th>
        <th style="width:60px">Port</th><th style="width:120px">Source IP</th>
        <th style="width:120px">DB Credential</th>
        <th style="width:96px">연동 대상 논리 DB</th><th style="width:96px">연동 제외 논리 DB</th>
        <th style="width:110px">Connection Status</th>
      </tr></thead>
      <tbody>
        ${slice.map((r,i)=>`
        <tr>
          <td><span class="tag gray">${r.kind}</span></td>
          <td><span class="tag blue">${r.db}</span></td>
          <td>${connText(r)}${r.st==='Failed'&&r.fail?` <span class="ftag err">${esc(r.fail)}</span>`:''}</td>
          <td class="mono">${r.port}</td>
          <td class="mono">${r.srcIps.map(esc).join(' · ')}</td>
          <td class="mono">${esc(r.cred)}</td>
          <td>${ldbCountCell(ts,i,r,'inc')}</td>
          <td>${ldbCountCell(ts,i,r,'exc')}</td>
          <td>${tcStatusTag(r.st)}</td>
        </tr>`).join('')}
      </tbody>`:`
      <thead><tr>
        <th style="width:104px">Database Type</th><th>Resource ID</th><th style="width:110px">Region</th>
        <th style="width:130px">Resource Name</th><th style="width:120px">DB Credential</th>
        <th style="width:96px">연동 대상 논리 DB</th><th style="width:96px">연동 제외 논리 DB</th>
        <th style="width:110px">Connection Status</th>
      </tr></thead>
      <tbody>
        ${slice.map((r,i)=>`
        <tr>
          <td><span class="tag blue">${r.db}</span></td>
          <td>${resIdCell(r.id)}</td>
          <td class="mono">${r.region}</td>
          <td class="mono">${esc(r.name)}</td>
          <td class="mono">${esc(r.cred)}</td>
          <td>${ldbCountCell(ts,i,r,'inc')}</td>
          <td>${ldbCountCell(ts,i,r,'exc')}</td>
          <td>${tcStatusTag(r.st)}</td>
        </tr>`).join('')}
      </tbody>`}
    </table>
    </div>
    ${pagerHtml('tcd',d.rows.length)}
    <div class="section-desc" style="margin-bottom:0">논리 DB 개수를 누르면 연동 대상·제외 목록을 바로 볼 수 있어요</div>
  </div>`;
}

/* ── 논리 DB 조회 모달 (앱 논리 DB 확인 모달 문법 · 조회 전용) ── */
let ldbTab='inc';
function openLdbModal(ts,idx,tab){
  ldbTab=tab;
  renderLdbModal(ts,idx);
}
function renderLdbModal(ts,idx){
  const d=TC_DETAILS[ts]; const r=d.rows[idx];
  const isInc=ldbTab==='inc';
  const list=isInc?r.inc:(r.exc||[]);
  const label=r.name||r.host||(r.ips&&r.ips.join(' · '))||'';
  const slice=pslice(list,'ldb');
  openModal(`<div class="modal app" style="width:840px">
    <div class="am-header">
      <span class="am-eyebrow"><span class="ey-ctx">연결 테스트</span><span class="ey-sep">·</span><span class="ey-id">#${ts}</span></span>
      <h3 class="am-title">논리 DB 확인</h3>
      <div class="am-meta"><span class="tag blue">${r.db}</span><span class="mono">${esc(label)}</span></div>
      <p class="am-sub">이 리소스에서 조회된 논리 DB 목록이에요. 제외 목록은 서비스 오너가 설정해요.</p>
    </div>
    <div class="am-body">
      <div class="seg" id="ldb-seg" style="margin-bottom:16px">
        <button data-t="inc" class="${isInc?'on':''}">연동 대상<span class="cnt">${r.inc.length}</span></button>
        <button data-t="exc" class="${!isInc?'on':''}">연동 제외<span class="cnt">${(r.exc||[]).length}</span></button>
      </div>
      <div class="res-wrap">
      <table class="res-tbl">
        <thead><tr>
          <th style="width:100px">구분</th><th>Database</th><th>Schema</th>
          ${isInc?'':'<th style="width:100px">제외 사유</th>'}
        </tr></thead>
        <tbody>
          ${slice.length?slice.map(it=>`
          <tr>
            <td><span class="tag gray">${it.type}</span></td>
            <td class="mono">${esc(it.db)}</td>
            <td>${it.schema?`<span class="mono">${esc(it.schema)}</span>`:'<span class="muted">—</span>'}</td>
            ${isInc?'':`<td><span class="ftag na">${it.reason}</span></td>`}
          </tr>`).join(''):`<tr><td colspan="${isInc?3:4}"><div class="empty">${isInc?'연동 대상 논리 DB가 없어요':'제외된 논리 DB가 없어요'}</div></td></tr>`}
        </tbody>
      </table>
      </div>
      ${pagerHtml('ldb',list.length)}
    </div>
    <div class="am-footer"><button class="btn secondary" onclick="closeModal()">닫기</button></div></div>`);
  $('#ldb-seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ldbTab=b.dataset.t;PG.ldb.page=1;renderLdbModal(ts,idx);});
  const root=$('#modal-root');
  root.querySelectorAll('[data-pgsize]').forEach(s=>s.onchange=()=>{PG.ldb.size=+s.value;PG.ldb.page=1;renderLdbModal(ts,idx);});
  root.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{PG.ldb.page=+b.dataset.pg.split(':')[1];renderLdbModal(ts,idx);});
}

/* ══════════ 페이지별 바인딩 ══════════ */
function bindPage(){
  document.querySelectorAll('[data-nav]').forEach(n=>{
    if(n.closest('#sidebar'))return;
    n.addEventListener('click',()=>nav(n.getAttribute('data-nav')));
  });
  document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy);
    toast('복사했어요');
  }));
  document.querySelectorAll('[data-pgsize]').forEach(s=>s.onchange=()=>{
    const key=s.dataset.pgsize; PG[key].size=+s.value; PG[key].page=1; render();
  });
  document.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{
    const [key,p]=b.dataset.pg.split(':'); PG[key].page=+p; render();
  });
  const st=$('#proc-st'); if(st) st.onchange=e=>{procFilter=e.target.value;PG.proc.page=1;render();};
  const q=$('#proc-q'); if(q){q.oninput=e=>{procQ=e.target.value.trim();PG.proc.page=1;
    const pos=e.target.selectionStart;render();const nq=$('#proc-q');nq.focus();nq.setSelectionRange(pos,pos);};}
  const rseg=$('#req-seg'); if(rseg) rseg.querySelectorAll('button').forEach(b=>b.onclick=()=>{reqTab=b.dataset.t;PG.req.page=1;render();});
  const tseg=$('#tc-seg'); if(tseg) tseg.querySelectorAll('button').forEach(b=>b.onclick=()=>{tcTab=b.dataset.t;PG.tc.page=1;render();});

  /* NLB 배정 편집 */
  const nlbBtn=$('#nlb-status-btn'); if(nlbBtn) nlbBtn.onclick=openNlbModal;
  document.querySelectorAll('.nlb-sel').forEach(sel=>sel.onchange=e=>{
    nlbDraft[sel.dataset.rid]=+e.target.value;render();
  });
  document.querySelectorAll('.nlb-save').forEach(btn=>btn.onclick=()=>{
    const rid=btn.dataset.rid;
    const m=location.hash.match(/^#\/requests\/(\d+)/); const d=DETAILS[+m[1]];
    const r=d.resources.find(x=>x.rid===rid);
    const from=r.nlb,to=nlbDraft[rid];
    NLB.find(n=>n.idx===from).occ--; NLB.find(n=>n.idx===to).occ++;
    r.nlb=to; delete nlbDraft[rid];
    toast(`NLB #${from} → #${to} 변경을 저장했어요`);
    render();
  });

  /* 논리 DB 조회 + 연결 테스트 액션 */
  document.querySelectorAll('.ldb-link').forEach(el=>el.onclick=()=>{
    const [ts,idx,tab]=el.dataset.ldb.split(':');
    openLdbModal(+ts,+idx,tab);
  });
  const bindCount=(ta,cnt,limit)=>{const f=()=>{cnt.textContent=`${ta.value.length.toLocaleString()} / ${limit.toLocaleString()}`;};f();return f;};
  const tcRerun=$('#tc-rerun'); if(tcRerun) tcRerun.onclick=()=>{
    const m=location.hash.match(/^#\/tc\/(\d+)/); const d=TC_DETAILS[+m[1]];
    openModal(`<div class="modal app">
      <div class="am-header">
        <span class="am-eyebrow"><span class="ey-ctx">연결 테스트</span><span class="ey-sep">·</span><span class="ey-id">#${m[1]}</span></span>
        <h3 class="am-title">연결 테스트 재실행 요청</h3>
        <p class="am-sub">${esc(d.svc)}에 연결 테스트를 다시 실행해 달라고 요청해요. 사유는 서비스 오너에게 그대로 전달돼요.</p>
      </div>
      <div class="am-body">
        <div class="am-label">재실행 요청 사유 (필수)</div>
        <textarea id="tr-reason" maxlength="512" placeholder="무엇을 확인하고 다시 실행해야 하는지 적어 주세요"></textarea>
        <div class="am-count" id="tr-count"></div>
      </div>
      <div class="am-footer"><button class="btn secondary" onclick="closeModal()">취소</button>
      <button class="btn dangersolid" id="tr-go" disabled>재실행 요청</button></div></div>`);
    const ta=$('#tr-reason'),go=$('#tr-go');
    const upd=bindCount(ta,$('#tr-count'),512);
    ta.oninput=()=>{upd();go.disabled=!ta.value.trim();};
    go.onclick=()=>{closeModal();toast('재실행을 요청했어요 — 사유가 전달됐어요');};
  };
  const tcConfirm=$('#tc-confirm'); if(tcConfirm) tcConfirm.onclick=()=>{
    const m=location.hash.match(/^#\/tc\/(\d+)/); const d=TC_DETAILS[+m[1]];
    const incTotal=d.rows.reduce((a,r)=>a+(r.inc?r.inc.length:0),0);
    const excTotal=d.rows.reduce((a,r)=>a+(r.exc?r.exc.length:0),0);
    openModal(`<div class="modal app">
      <div class="am-header">
        <span class="am-eyebrow"><span class="ey-ctx">연결 테스트</span><span class="ey-sep">·</span><span class="ey-id">#${m[1]}</span></span>
        <h3 class="am-title">연동 승인</h3>
        <p class="am-sub">${esc(d.svc)}의 PII Agent 설치를 확정해요. 승인하면 연동이 완료되고 모니터링이 시작돼요.</p>
      </div>
      <div class="am-body">
        <div class="am-note" style="background:var(--bg-inner);border-color:var(--border)">
          <svg class="ic sm"><use href="#i-check"/></svg>
          접속 성공 ${d.rows.filter(r=>r.st==='Success').length}건 · 연동 대상 논리 DB ${incTotal}개 · 제외 ${excTotal}개를 확인했어요.
        </div>
      </div>
      <div class="am-footer"><button class="btn secondary" onclick="closeModal()">취소</button>
      <button class="btn primary" id="cf-go">승인</button></div></div>`);
    $('#cf-go').onclick=()=>{closeModal();toast('연동을 승인했어요 — 연동이 완료됐어요');};
  };

  /* 연동 요청 승인 / 반려 — 앱 모달 문법, 메시지 1,024자 제한 */
  const ap=$('#act-approve'); if(ap) ap.onclick=()=>{
    const m=location.hash.match(/^#\/requests\/(\d+)/); const d=DETAILS[+m[1]];
    const dirtyCnt=Object.keys(nlbDraft).length;
    openModal(`<div class="modal app">
      <div class="am-header">
        <span class="am-eyebrow"><span class="ey-ctx">연동 요청</span><span class="ey-sep">·</span><span class="ey-id">#${m[1]}</span></span>
        <h3 class="am-title">연동 요청 승인</h3>
        <p class="am-sub">${esc(d.svc)}의 선택 리소스 ${d.selected}건을 승인해요. 승인하면 연동 대상 반영이 시작돼요.</p>
      </div>
      <div class="am-body">
        ${dirtyCnt?`<div class="am-note"><svg class="ic sm"><use href="#i-alert"/></svg>
          저장하지 않은 NLB 변경 ${dirtyCnt}건이 있어요. 승인 전에 저장하지 않으면 반영되지 않아요.</div>`:''}
        <div class="am-label">승인 코멘트 (선택)</div>
        <textarea id="ap-comment" maxlength="1024" placeholder="서비스 오너에게 전달할 코멘트를 남길 수 있어요"></textarea>
        <div class="am-count" id="ap-count"></div>
      </div>
      <div class="am-footer"><button class="btn secondary" onclick="closeModal()">취소</button>
      <button class="btn primary" id="ap-go">승인</button></div></div>`);
    const ta=$('#ap-comment');
    ta.oninput=bindCount(ta,$('#ap-count'),1024);
    $('#ap-go').onclick=()=>{closeModal();toast('승인했어요 — 연동 대상 반영이 시작돼요');};
  };
  const rj=$('#act-reject'); if(rj) rj.onclick=()=>{
    const m=location.hash.match(/^#\/requests\/(\d+)/); const d=DETAILS[+m[1]];
    openModal(`<div class="modal app">
      <div class="am-header">
        <span class="am-eyebrow"><span class="ey-ctx">연동 요청</span><span class="ey-sep">·</span><span class="ey-id">#${m[1]}</span></span>
        <h3 class="am-title">연동 요청 반려</h3>
        <p class="am-sub">${esc(d.svc)}의 요청을 반려해요. 사유는 서비스 오너에게 그대로 전달돼요.</p>
      </div>
      <div class="am-body">
        <div class="am-label">반려 사유 (필수)</div>
        <textarea id="rj-reason" maxlength="1024" placeholder="서비스 오너가 무엇을 고쳐 다시 요청해야 하는지 적어 주세요"></textarea>
        <div class="am-count" id="rj-count"></div>
      </div>
      <div class="am-footer"><button class="btn secondary" onclick="closeModal()">취소</button>
      <button class="btn dangersolid" id="rj-go" disabled>반려</button></div></div>`);
    const ta=$('#rj-reason'),go=$('#rj-go');
    const upd=bindCount(ta,$('#rj-count'),1024);
    ta.oninput=()=>{upd();go.disabled=!ta.value.trim();};
    go.onclick=()=>{closeModal();toast('반려했어요 — 사유가 전달됐어요');};
  };
}
</script>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-search"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g>
    <g id="i-arrow"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></g>
    <g id="i-check"><path d="M20 6 9 17l-5-5"/></g>
    <g id="i-copy"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></g>
    <g id="i-chev-l"><polyline points="15 18 9 12 15 6"/></g>
    <g id="i-chev-r"><polyline points="9 18 15 12 9 6"/></g>
    <g id="i-alert"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></g>
