<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>운영 콘솔 — PII Admin</title>
<style>
/* ══ Admin 운영 콘솔 프로토타입 (r1) ══
   상속: admin-taskqueue.html r2 (다크 크롬 + 라이트 캔버스) — 토큰·컨트롤 3단(32/28/20)·
   타입 스케일 {12,14,16,20,24,32}·간격 {4,8,12,16,24,64}.
   확장 포인트(코드 수정 없이 데이터 추가만으로 확장):
     · 좌측 메뉴  → JS `MENU` 배열에 그룹/항목 추가
     · TS 상세 탭 → `COMMON_TABS` + `PROVIDER_TABS[provider]` 레지스트리에 {id,label,render} 추가
     · Provider   → `PROVIDERS`에 색·라벨·metadata 렌더러 추가 */
:root{
  --gray-50:#F9FAFB; --gray-100:#F2F4F7; --gray-200:#E4E7EC; --gray-300:#D0D5DD;
  --gray-400:#98A2B3; --gray-500:#667085; --gray-600:#475467; --gray-700:#344054;
  --gray-800:#1D2939; --gray-900:#101828;
  --bg-page:#F9FAFB; --bg-card:#FFFFFF; --bg-inner:#F9FAFB;
  --border:#E4E7EC; --border-strong:#D0D5DD;
  --text-strong:var(--gray-900); --text-medium:var(--gray-700);
  --text-weak:var(--gray-500); --text-faint:var(--gray-400);
  --primary:#2563EB; --primary-hover:#1D4ED8; --primary-bg:#EFF4FF; --primary-ring:#D1E0FF;
  --ok:#12B76A; --ok-text:#027A48; --ok-bg:#ECFDF3; --ok-border:#A6F4C5;
  --err:#F04438; --err-text:#B42318; --err-bg:#FEF3F2; --err-border:#FDA29B;
  --info:#2E90FA; --info-text:#175CD3; --info-bg:#EFF8FF; --info-border:#B2DDFF;
  --warn:#F79009; --warn-text:#B54708; --warn-bg:#FFFAEB; --warn-border:#FEDF89;
  --off:#98A2B3; --off-text:#475467; --off-bg:#F2F4F7;
  --err-solid:#D92D20; --err-solid-hover:#B42318;
  --pv-aws:#EC7211; --pv-azure:#0078D4; --pv-gcp:#4285F4; --pv-idc:#344054; --pv-sdu:#7F56D9;
  --white:#FFFFFF;
  --r-card:10px; --r-inner:8px; --r-ctl:8px;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 32px -8px rgba(16,24,40,.16),0 4px 10px -4px rgba(16,24,40,.08);
  --font-sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-strong);
  font-family:var(--font-sans);font-size:14px;letter-spacing:-0.014em;line-height:1.4;
  -webkit-font-smoothing:antialiased;min-width:1080px}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
svg.ic.sm{width:14px;height:14px;vertical-align:-2px}
svg.ic.xs{width:12px;height:12px;vertical-align:-1px}

.meta{font-size:12px;font-weight:400;color:var(--text-weak);line-height:1.4}
.mono{font-family:var(--font-mono);font-size:12px;color:var(--text-strong)}
.link{color:var(--primary);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}
.muted{color:var(--text-weak)}
.mt-16{margin-top:16px}.mt-12{margin-top:12px}

/* ── App shell ── */
.topnav{height:52px;background:#101828;border-bottom:1px solid #101828;
  display:flex;align-items:stretch;gap:4px;padding:0 24px;position:sticky;top:0;z-index:20}
.topnav .brand{color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;margin-right:20px}
.topnav .brand::before{content:"";width:20px;height:20px;border-radius:6px;flex:none;
  background:linear-gradient(135deg,var(--primary),#7F56D9)}
.topnav .nav-item{color:#98A2B3;font-size:14px;font-weight:500;display:flex;align-items:center;
  padding:0 12px;border-bottom:2px solid transparent;cursor:default}
.topnav .nav-item.active{color:#fff;font-weight:600;border-bottom-color:var(--primary)}
.topnav .nav-item.off{opacity:.5}
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:216px;flex:none;background:#101828;border-right:1px solid #101828;padding:16px 12px}
.sidebar .sb-title{font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:8px 10px 10px;color:#667085}
.sidebar .sb-group+.sb-group .sb-title{margin-top:16px}
.sidebar .sb-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;color:#B9C0CC;
  font-size:14px;font-weight:500;cursor:pointer;margin-bottom:2px}
.sidebar .sb-item:hover{background:#1D2939}
.sidebar .sb-item.active{background:#1D2939;color:#fff;font-weight:600;
  box-shadow:inset 2px 0 0 var(--primary)}
.sidebar .sb-item .sb-cnt{margin-left:auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--err-solid);color:#fff;border-radius:999px;min-width:20px;height:18px;
  display:inline-grid;place-items:center;padding:0 6px}
.content{flex:1;padding:24px 32px 48px;min-width:0;max-width:1440px}
.breadcrumb{font-size:12px;color:var(--text-weak);margin-bottom:12px}
.breadcrumb .crumb{cursor:pointer}
.breadcrumb .crumb:hover{color:var(--text-medium);text-decoration:underline}
.breadcrumb .sep{margin:0 6px;color:var(--text-faint)}
.breadcrumb .cur{color:var(--text-medium);font-weight:600}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.page-head h1{font-size:24px;font-weight:700;margin:0;line-height:1.2;letter-spacing:-.02em;
  display:flex;align-items:center;gap:10px}
.page-head h1 .h-id{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--text-weak)}
.page-head .head-sub{font-size:14px;color:var(--text-weak);margin-top:8px}
.page-head .actions{display:flex;gap:8px;flex:none}
.page-head.detail-head{padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:0}
.head-meta{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;flex-wrap:wrap}
.head-meta .hm-k{font-size:12px;font-weight:600;color:var(--text-weak)}
.head-meta .hm-v{color:var(--text-strong);font-weight:500;font-variant-numeric:tabular-nums}
.head-meta .hm-sep{color:var(--text-faint)}
.section-title{font-size:20px;font-weight:600;color:var(--text-strong);margin:64px 0 12px;line-height:1.2}
.section-title:first-child{margin-top:0}
.section-desc{font-size:12px;font-weight:400;color:var(--text-weak);line-height:1.4;margin:16px 0 16px}
.subsection-title{font-size:14px;font-weight:600;color:var(--text-medium);margin:16px 0 10px}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-card);
  box-shadow:var(--shadow-xs);padding:20px 24px 24px}
.card+.card{margin-top:16px}
.card .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.card .card-title{font-size:16px;font-weight:600;color:var(--text-strong)}
.card-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.card-grid2>.card+.card{margin-top:0}

/* ── Stat 타일 (클릭 = 필터) ── */
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,260px));gap:12px}
.stat{background:var(--gray-100);border:1px solid var(--border);border-radius:var(--r-card);
  padding:20px 24px 24px;text-align:center;cursor:pointer}
.stat:hover{border-color:var(--border-strong)}
.stat.on{background:var(--bg-card);border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.stat .lbl{font-size:14px;font-weight:600;color:var(--text-medium)}
.stat .val{font-size:32px;font-weight:600;margin-top:12px;line-height:1.2;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .val.v-err{color:var(--err-text)}
.stat .val.v-warn{color:var(--warn-text)}

/* ── 테이블 (admin-pipeline 리듬 th34/td44) ── */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--text-weak);letter-spacing:.03em;
  height:34px;padding:0 12px;border-bottom:1px solid var(--border)}
.tbl td{height:44px;padding:8px 12px;border-bottom:1px solid var(--gray-100);color:var(--text-medium);
  vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--gray-50)}
.tbl .mono{font-family:var(--font-mono);font-size:12px;color:var(--text-strong)}
.tbl td.chev{text-align:right;width:48px;white-space:nowrap;color:var(--text-faint)}
.svc-name{font-weight:600;color:var(--text-strong)}

/* ── Tag / Pill / Provider ── */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  padding:2px 8px;border-radius:6px;vertical-align:middle}
.tag.blue{background:#E8F1FF;color:#1747B5}
.tag.gray{background:var(--gray-100);color:var(--text-medium)}
.tag.green{background:var(--ok-bg);color:var(--ok-text)}
.tag.red{background:var(--err-bg);color:var(--err-text)}
.tag.orange{background:var(--warn-bg);color:var(--warn-text)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  height:20px;padding:0 9px 0 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%}
.pill.t-off{background:var(--off-bg);color:var(--off-text)} .pill.t-off .dot{background:var(--gray-300)}
.pill.t-warn{background:var(--warn-bg);color:var(--warn-text)} .pill.t-warn .dot{background:var(--warn)}
.pill.t-info{background:var(--info-bg);color:var(--info-text)} .pill.t-info .dot{background:var(--info)}
.pill.t-run{background:var(--info-bg);color:var(--info-text)} .pill.t-run .dot{background:var(--info);animation:pulse 1.6s ease-in-out infinite}
.pill.t-ready{background:var(--primary-bg);color:var(--primary)} .pill.t-ready .dot{background:var(--primary)}
.pill.t-ok{background:var(--ok-bg);color:var(--ok-text)} .pill.t-ok .dot{background:var(--ok)}
.pill.t-err{background:var(--err-bg);color:var(--err-text)} .pill.t-err .dot{background:var(--err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ptag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-medium)}
.ptag .pdot{width:8px;height:8px;border-radius:2.5px}

/* ── KeyValueGrid ── */
.kv2{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;font-size:14px}
.kv2 .k{font-size:12px;font-weight:600;color:var(--text-weak);line-height:1.6}
.kv2 .v{color:var(--text-strong);font-weight:500;line-height:1.6;word-break:break-all}
.kv2 .v .mono{font-size:12px}

/* ── Controls ── */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filterbar .spacer{flex:1}
.searchbox{position:relative;display:inline-block}
.searchbox svg.ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;
  color:var(--text-faint);pointer-events:none}
.searchbox .input{padding-left:30px;width:100%}
.input,select.sel{height:32px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);padding:0 10px;
  font-size:14px;font-family:inherit;color:var(--text-strong);background:var(--bg-card);outline:none}
.input:focus,select.sel:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;
  border-radius:var(--r-ctl);font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;
  white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:disabled{cursor:not-allowed}
.btn.primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-xs)}
.btn.primary:not(:disabled):hover{background:var(--primary-hover)}
.btn.primary:disabled{background:var(--gray-100);color:var(--text-faint);box-shadow:none}
.btn.secondary{background:var(--bg-card);color:var(--text-medium);border-color:var(--border-strong);box-shadow:var(--shadow-xs)}
.btn.secondary:not(:disabled):hover{background:var(--gray-50)}
.btn.secondary:disabled{color:var(--text-faint)}
.btn.danger{background:var(--bg-card);color:var(--err-text);border-color:var(--err-border);box-shadow:var(--shadow-xs)}
.btn.danger:not(:disabled):hover{background:var(--err-bg)}
.btn.dangersolid{background:var(--err-solid);color:#fff;box-shadow:var(--shadow-xs)}
.btn.dangersolid:not(:disabled):hover{background:var(--err-solid-hover)}
.btn.dangersolid:disabled{background:var(--gray-100);color:var(--text-faint);box-shadow:none}
.btn.sm{height:28px;padding:0 10px;font-size:12px}

/* ── 지연 표기 — 4단계: 회색(1시간 미만)/노랑(1시간↑)/주황(1일↑)/빨강(7일↑) ── */
.delay{font-variant-numeric:tabular-nums;font-weight:500;color:var(--text-weak)}
.delay.d1{color:#A16207;font-weight:600}
.delay.d2{color:#C2410C;font-weight:600}
.delay.d3{color:#DC2626;font-weight:700}

/* ── TS 상세: 3-tier 표면 (chrome 다크 · masthead 화이트 · tab rail 틴트 · body 그레이) ── */
.ts-mast{background:var(--bg-card);margin:-24px -32px 0;padding:20px 32px 18px;
  border-bottom:1px solid var(--border)}
.ts-mast .breadcrumb{margin-bottom:10px}
.mast-id{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
/* 계층 (app /pass/admin/pipelines 정합) — 크기·굵기·색·간격으로 tier 구분:
   TS id 28/700 gray-900 (최강조) > 서비스명 18/600 gray-900 (강조) > label 13/400 gray-500 > value 15/400 gray-900 */
/* 현재 단계 — 타이틀 위 eyebrow */
.mast-eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mast-eyebrow .mp-k{font-size:13px;font-weight:400;color:var(--gray-500)}
.mast-id h1{font-size:28px;font-weight:700;margin:0;line-height:1;color:var(--gray-900)}
.mast-id h1 .tid{font-size:18px;font-weight:500;color:var(--gray-400);margin-left:4px}
.mast-sub{display:flex;align-items:center;gap:8px;margin-top:10px}
.mast-sub .svc{font-size:18px;font-weight:600;color:var(--gray-900)}
.mast-sub .code{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--gray-700);
  background:var(--gray-100);padding:1px 8px;border-radius:6px}
.mast-id .actions{display:flex;gap:8px;flex:none}
/* reference 메타 — provider(AWS 등) 정보는 provider 태그와 한 그룹으로 묶음 */
.mast-meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px 40px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.mast-meta.second{margin-top:12px;padding-top:0;border-top:0}
.mast-meta .cell{display:flex;align-items:center;gap:8px}
.mast-meta .k{font-size:13px;font-weight:400;color:var(--gray-500)}
.mast-meta .v{font-size:15px;font-weight:400;color:var(--gray-900);font-variant-numeric:tabular-nums}
.pv-group{display:inline-flex;align-items:center;flex-wrap:wrap;gap:8px 20px;
  padding:8px 14px;background:var(--gray-50);border:1px solid var(--border);border-radius:8px}
.pv-group .ptag{font-weight:600}
.jchip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:1px 6px;border-radius:6px}
.jchip:hover{background:var(--gray-50)}
.jchip .mono{font-size:13px;color:var(--primary);font-weight:600}

/* tab rail — 독립 틴트 밴드; 활성 탭만 화이트로 body에 연결 */
.tabbar{display:flex;gap:2px;background:var(--gray-100);border-bottom:1px solid var(--border);
  margin:0 -32px 24px;padding:0 32px}
.tabbar .tab{padding:12px 16px;font-size:14px;font-weight:500;color:var(--text-weak);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:6px 6px 0 0}
.tabbar .tab:hover{color:var(--text-medium);background:var(--gray-50)}
.tabbar .tab.on{color:var(--primary);font-weight:600;border-bottom-color:var(--primary);background:var(--bg-card)}
.tabbar .tab .tmark{display:inline-block;width:6px;height:6px;border-radius:999px;background:var(--warn);
  vertical-align:6px;margin-left:4px}

/* ── Step rail (Process Status 탭) ── */
.steprail{display:flex;align-items:flex-start;margin:8px 0 4px}
.steprail .sp{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.steprail .sp::before{content:"";position:absolute;top:11px;left:calc(-50% + 14px);right:calc(50% + 14px);
  height:2px;background:var(--gray-200)}
.steprail .sp:first-child::before{display:none}
.steprail .sp.done::before,.steprail .sp.cur::before{background:var(--primary)}
.steprail .sp .n{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;
  font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--gray-100);color:var(--text-faint);border:1px solid var(--border)}
.steprail .sp.done .n{background:var(--primary);border-color:var(--primary);color:#fff}
.steprail .sp.cur .n{background:var(--bg-card);border:2px solid var(--primary);color:var(--primary)}
.steprail .sp .t{font-size:12px;font-weight:500;color:var(--text-faint);text-align:center;line-height:1.3;max-width:96px}
.steprail .sp.done .t{color:var(--text-weak)}
.steprail .sp.cur .t{color:var(--primary);font-weight:600}

/* ── 권한 체크리스트 (AWS Role 검증) ── */
.check-list{border:1px solid var(--border);border-radius:var(--r-inner);overflow:hidden;margin-top:12px}
.check-list .ck{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14px;
  border-top:1px solid var(--gray-100);color:var(--text-medium)}
.check-list .ck:first-child{border-top:0}
.check-list .ck .mono{flex:1}
.check-list .ck svg.ic{width:15px;height:15px}
.check-list .ck.ok svg.ic{color:var(--ok-text)}
.check-list .ck.err{background:var(--err-bg)}
.check-list .ck.err svg.ic{color:var(--err-text)}
.check-list .ck.err .mono{color:var(--err-text)}
.ck-verdict{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:600}
.ck-verdict.ok{color:var(--ok-text)} .ck-verdict.err{color:var(--err-text)}

/* ── 설치 모드 선택 카드 ── */
.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.mode-opt{border:1px solid var(--border-strong);border-radius:var(--r-inner);padding:14px 16px;
  cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--bg-card)}
.mode-opt:hover{background:var(--gray-50)}
.mode-opt.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring);background:var(--primary-bg)}
.mode-opt .radio{width:16px;height:16px;border-radius:999px;border:1.5px solid var(--border-strong);
  flex:none;margin-top:1px;display:grid;place-items:center}
.mode-opt.on .radio{border-color:var(--primary)}
.mode-opt.on .radio::after{content:"";width:8px;height:8px;border-radius:999px;background:var(--primary)}
.mode-opt .mt{font-size:14px;font-weight:600;color:var(--text-strong)}
.mode-opt .md{font-size:12px;color:var(--text-weak);margin-top:4px;line-height:1.4}

/* ── 안내/경고 박스 ── */
.note{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-border);
  border-radius:var(--r-inner);padding:10px 12px;font-size:14px;color:var(--text-medium);line-height:1.4}
.note svg.ic{color:var(--warn-text);flex:none;margin-top:1px}

.modal label.chk input{margin-top:2px;accent-color:var(--err-solid)}
.modal label.chk b{color:var(--err-text)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gray-900);
  color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);

const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function icon(name, cls){
  const paths = {
    search:'<circle cx="7" cy="7" r="5"/><path d="m14 14-3.2-3.2"/>',
    check:'<path d="M13.5 4.5 6.5 11.5 2.5 7.5"/>',
    x:'<path d="M12 4 4 12M4 4l8 8"/>',
    alert:'<path d="M8 5.5v3.5"/><circle cx="8" cy="11.5" r=".5"/><path d="M8 1.8 1.6 13.2h12.8L8 1.8z"/>',
    info:'<circle cx="8" cy="8" r="6.4"/><path d="M8 7.5v3.4"/><circle cx="8" cy="5.2" r=".5"/>',
    refresh:'<path d="M13.6 8a5.6 5.6 0 1 1-1.7-4L14 6"/><path d="M14 2v4h-4"/>',
    chev:'<path d="m6 3.5 4.5 4.5L6 12.5"/>',
    open:'<path d="M6.5 3.5H3.2A1.2 1.2 0 0 0 2 4.7v8.1A1.2 1.2 0 0 0 3.2 14h8.1a1.2 1.2 0 0 0 1.2-1.2V9.5"/><path d="M9.5 2H14v4.5"/><path d="M14 2 7.5 8.5"/>',
    play:'<path d="M4.5 3.2v9.6L13 8 4.5 3.2z"/>',

    plus:'<path d="M8 3.2v9.6M3.2 8h9.6"/>',
  };
  return `<svg class="ic ${cls||''}" viewBox="0 0 16 16">${paths[name]||''}</svg>`;
}
function pill(st){ const s=STEP[st]; return `<span class="pill ${s.tone}"><span class="dot"></span>Step ${s.n} · ${s.label}</span>`; }
function ptag(pv){ return `<span class="ptag"><span class="pdot" style="background:${PROVIDERS[pv].color}"></span>${pv}</span>`; }
function delayCell(sec){
  const cls = sec>=604800?'d3':sec>=86400?'d2':sec>=3600?'d1':'';
  const h = Math.floor(sec/3600), d = Math.floor(h/24);
  const txt = d>0?`${d}일 ${h%24}시간`:h>0?`${h}시간`:`${Math.floor(sec/60)}분`;
  return `<span class="delay ${cls}">${txt}</span>`;
}
function toast(msg){
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast">${icon('check')}${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(()=>root.innerHTML='', 2600);
}

  {key:'STALE',     lbl:'장기 정체 (7일↑)', need:'원인 확인',          tone:''},
];
let alertFilter = 'ALL';
function alertRows(){
  return TS.filter(t=>{
    if(alertFilter==='ALL')   return ['PENDING','CONFIRMED','CONNECTED'].includes(t.st) || t.delay>=604800;

    return t.st===alertFilter;
  });
}

  const rows = alertRows();

}

/* 재렌더 후 검색 input 포커스 복원 */
function refocus(el){
  const id = el.placeholder;
  requestAnimationFrame(()=>{
    const nx = [...document.querySelectorAll('input')].find(i=>i.placeholder===id);
    if(nx){ nx.focus(); nx.setSelectionRange(nx.value.length, nx.value.length); }
  });
}

function openEosModal(code){
  const s = svcOf(code);
  const running = TS.filter(t=>t.svc===code && t.pipelines.some(p=>p.st==='RUNNING')).length;
  openModal(`
    <h3>EOS 처리 — ${esc(s.name)} (${s.code})</h3>
    <div class="desc">서비스의 모든 Target Source ${TS.filter(t=>t.svc===code).length}건이 연동 종료됩니다. 이 작업은 되돌릴 수 없습니다.</div>
    ${running?`<div class="note err">${icon('alert')}<div>진행 중인 파이프라인이 있는 Target Source가 <b>${running}건</b> 있습니다. Force 없이 처리 시 실패합니다.</div></div>`:''}
    <label class="chk"><input type="checkbox" id="eos-force">
      <span><b>Force 강제 처리</b> — 진행 중인 파이프라인·승인 절차를 무시하고 즉시 EOS 처리합니다.</span></label>
    <div class="foot">
      <button class="btn secondary" onclick="closeModal()">취소</button>
      <button class="btn dangersolid" onclick="doEos('${code}')">EOS 처리</button>
    </div>`);
}
function doEos(code){
  const force = document.getElementById('eos-force').checked;
  svcOf(code).status='EOS';
  closeModal(); toast(force?'Force 옵션으로 EOS 처리했습니다':'EOS 처리했습니다');
  renderService(code); renderSidebar();
}

  const j = svcOf(code).jira[idx];

function stepRail(t){
  const cur = STEP[t.st];
  return `<div class="steprail">

      return `<div class="sp ${cls}"><div class="n">${s.n<cur.n?icon('check','xs'):s.n}</div><div class="t">${s.label}</div></div>`;}).join('')}
  </div>`;
}
function jiraChip(j){
  if(!j) return '<span class="muted">미연결</span>';

  const t = tsOf(id);

function doDeleteConfirmed(id){
  const v = document.getElementById('del-reason').value.trim();
  if(!v){ toast('삭제 사유를 입력하세요'); return; }
  tsOf(id).confirmed = null;
  closeModal(); toast('확정 정보를 삭제했습니다'); renderTs(id,'confirm');
}

/* ── 탭: 파이프라인 ── */
const PL_TONE = {RUNNING:'t-run', SUCCEEDED:'t-ok', FAILED:'t-err', CANCELED:'t-off'};
function tabPipeline(t){
  const running = t.pipelines.some(p=>p.st==='RUNNING');
  return `
    <div class="card">
      <div class="card-head"><div class="card-title">파이프라인 실행</div></div>
      ${running?`<div class="note info" style="margin-bottom:12px">${icon('info')}<div>진행 중인 파이프라인이 있어 새 실행이 제한됩니다.</div></div>`:''}
      <div style="display:flex;gap:8px">
        <button class="btn primary" ${running?'disabled':''} onclick="runPipeline(${t.id},'INSTALL')">${icon('play','sm')}설치 파이프라인 실행</button>
        <button class="btn danger" ${running?'disabled':''} onclick="runPipeline(${t.id},'DELETE')">${icon('trash','sm')}삭제 파이프라인 실행</button>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="card-title">최근 실행 현황</div>
        <span class="detail-link" onclick="toast('파이프라인 상세 페이지로 이동합니다 (프로토타입)')">파이프라인 페이지에서 전체 보기 ${icon('open','xs')}</span>
      </div>
      ${t.pipelines.length?`<table class="tbl">
        <thead><tr><th>Pipeline</th><th>종류</th><th>상태</th><th>시작</th><th>소요</th></tr></thead>
        <tbody>${t.pipelines.map(p=>`<tr>
          <td><span class="mono">${p.id}</span></td>
          <td>${p.kind==='INSTALL'?'<span class="tag blue">설치</span>':'<span class="tag red">삭제</span>'}</td>
          <td><span class="pill ${PL_TONE[p.st]}"><span class="dot"></span>${p.st}</span></td>
          <td>${p.at}</td><td>${p.dur}</td>
        </tr>`).join('')}</tbody></table>`
      :`<div class="empty">실행된 파이프라인이 없습니다.</div>`}
    </div>`;
}
function runPipeline(id, kind){
  const t = tsOf(id);
  const label = kind==='INSTALL'?'설치':'삭제';
  openModal(`
    <h3>${label} 파이프라인 실행 — <span class="mono" style="font-size:14px">#${t.id}</span></h3>
    <div class="desc">${kind==='INSTALL'
      ?'확정된 연동 정보를 기준으로 Agent 설치 파이프라인을 실행합니다.'
      :'설치된 Agent와 인프라 리소스를 제거하는 삭제 파이프라인을 실행합니다. 이 작업은 서비스 연동에 영향을 줍니다.'}</div>
    <div class="foot">
      <button class="btn secondary" onclick="closeModal()">취소</button>
      <button class="btn ${kind==='INSTALL'?'primary':'dangersolid'}" onclick="doRunPipeline(${t.id},'${kind}')">실행</button>
    </div>`);
}
let plSeq = 88300;
function doRunPipeline(id, kind){
  tsOf(id).pipelines.unshift({id:'PL-'+(plSeq++), kind, st:'RUNNING', at:'07-23 방금', dur:'—'});
  closeModal(); toast(`${kind==='INSTALL'?'설치':'삭제'} 파이프라인을 실행했습니다`); renderTs(id,'pipeline');
}

/* ── 탭: Test Connection (DB Credential 포함) ── */
function tabTc(t){
  return `
    <div class="card">
      <div class="card-head">
        <div class="card-title">최근 Test Connection</div>
        <button class="btn primary sm" onclick="toast('Test Connection을 실행했습니다 (async)')">${icon('play','xs')}Test Connection 실행</button>
      </div>
      ${t.tc?`<div class="kv2">
        ${kv('진행', `${t.tc.done} / ${t.tc.total} 완료`)}
        ${kv('실패', t.tc.fail?`<span class="tag red">${t.tc.fail}건 실패</span>`:'<span class="tag green">0건</span>')}
        ${kv('마지막 실행', t.tc.at)}
      </div>`:`<div class="empty">Test Connection 실행 이력이 없습니다.<br><span class="meta">Agent 설치 완료(Step 5) 이후 실행할 수 있습니다.</span></div>`}
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">DB Credential <span class="meta">연결 테스트에 사용 · ${t.creds.length}건</span></div></div>
      ${t.creds.length?`<table class="tbl">
        <thead><tr><th>논리 DB</th><th>계정</th><th>Secret 참조</th><th>상태</th><th>수정일</th></tr></thead>
        <tbody>${t.creds.map(c=>`<tr>
          <td class="svc-name">${esc(c.db)}</td>
          <td><span class="mono">${esc(c.user)}</span></td>
          <td><span class="mono">${esc(c.secret)}</span></td>
          <td><span class="tag green">${c.st}</span></td>
          <td>${c.at}</td>
        </tr>`).join('')}</tbody></table>`
      :`<div class="empty">등록된 Credential이 없습니다.</div>`}
    </div>`;
}

/* ── 탭: AWS 설정 ── */
function tabAws(t){
  return `
    <div class="card">
      <div class="card-head">
        <div class="card-title">설치 모드</div>
        <button class="btn primary sm" onclick="toast('설치 모드를 저장했습니다')">저장</button>
      </div>
      <div class="mode-row">
        <div class="mode-opt ${t.installMode==='AUTO'?'on':''}" onclick="tsOf(${t.id}).installMode='AUTO';renderTs(${t.id},'aws')">
          <span class="radio"></span>
          <div><div class="mt">자동 설치</div><div class="md">Terraform 파이프라인이 인프라를 자동으로 생성·설치합니다.</div></div>
        </div>
        <div class="mode-opt ${t.installMode==='MANUAL'?'on':''}" onclick="tsOf(${t.id}).installMode='MANUAL';renderTs(${t.id},'aws')">
          <span class="radio"></span>
          <div><div class="mt">수동 설치</div><div class="md">스크립트를 내려받아 서비스 측에서 직접 실행합니다. 진행 상황은 수동으로 확인 처리합니다.</div></div>
        </div>
      </div>
    </div>
    ${awsRoleCard(t,'scanRole','Scan Role','리소스 스캔에 사용')}
    ${awsRoleCard(t,'execRole','Terraform Execution Role','설치 파이프라인 실행에 사용')}`;
}
function awsRoleCard(t, key, title, desc){
  const r = t[key];
  return `
    <div class="card">
      <div class="card-head">
        <div class="card-title">${title} <span class="meta">${desc}</span></div>
        <button class="btn secondary sm" onclick="verifyRole(${t.id},'${key}')">${icon('refresh','xs')}권한 검증</button>
      </div>
      <div style="display:flex;gap:8px">
        <input class="input" id="arn-${key}" style="flex:1;font-family:var(--font-mono);font-size:12px" value="${esc(r.arn)}">
        <button class="btn secondary" onclick="saveRole(${t.id},'${key}')">등록·수정</button>
      </div>
      <div class="check-list">
        ${r.checks.map(c=>`<div class="ck ${c.ok?'ok':'err'}">${icon(c.ok?'check':'x','sm')}<span class="mono">${c.p}</span>
          <span class="meta">${c.ok?'허용':'권한 없음'}</span></div>`).join('')}
      </div>
      <div class="ck-verdict ${r.verified?'ok':'err'}">
        ${icon(r.verified?'check':'alert','sm')}
        ${r.verified?'모든 필수 권한이 확인되었습니다.':'누락된 권한이 있습니다 — Role 정책을 수정한 뒤 다시 검증하세요.'}
      </div>
    </div>`;
}
function saveRole(id, key){
  const v = document.getElementById('arn-'+key).value.trim();
  if(!v){ toast('Role ARN을 입력하세요'); return; }
  tsOf(id)[key].arn = v; toast('Role을 저장했습니다. 권한 검증을 실행하세요.');
}
function verifyRole(id, key){
  toast('권한 검증을 요청했습니다…');
  setTimeout(()=>{ toast('권한 검증 결과를 갱신했습니다'); renderTs(id,'aws'); }, 900);
}

    </div>`;
}

/* ══════════ 라우터 ══════════ */
function route(){
  const [, page, a, b] = location.hash.split('/');
  renderSidebar();
  window.scrollTo(0,0);
  closeModal();
  if(page==='services') return renderServices();
  if(page==='svc')      return renderService(a);
  if(page==='ts' && a)  return renderTs(a, b);
  if(page==='ts')       return renderTsSearch();
  return renderAlerts();
}
window.addEventListener('hashchange', route);
if(!location.hash) location.hash = '#/alerts';
route();
</script>
