<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>운영 콘솔 — PII Admin</title>
<style>
/* ══ Admin 운영 콘솔 프로토타입 (r1) ══
   상속: admin-taskqueue.html r2 (다크 크롬 + 라이트 캔버스) — 토큰·컨트롤 3단(32/28/20)·
   타입 스케일 {12,14,16,20,24,32}·간격 {4,8,12,16,24,64}.
   확장 포인트(코드 수정 없이 데이터 추가만으로 확장):
     · 좌측 메뉴  → JS `MENU` 배열에 그룹/항목 추가
     · TS 상세 탭 → `COMMON_TABS` + `PROVIDER_TABS[provider]` 레지스트리에 {id,label,render} 추가
     · Provider   → `PROVIDERS`에 색·라벨·metadata 렌더러 추가 */
:root{
  --gray-50:#F9FAFB; --gray-100:#F2F4F7; --gray-200:#E4E7EC; --gray-300:#D0D5DD;
  --gray-400:#98A2B3; --gray-500:#667085; --gray-600:#475467; --gray-700:#344054;
  --gray-800:#1D2939; --gray-900:#101828;
  --bg-page:#F9FAFB; --bg-card:#FFFFFF; --bg-inner:#F9FAFB;
  --border:#E4E7EC; --border-strong:#D0D5DD;
  --text-strong:var(--gray-900); --text-medium:var(--gray-700);
  --text-weak:var(--gray-500); --text-faint:var(--gray-400);
  --primary:#2563EB; --primary-hover:#1D4ED8; --primary-bg:#EFF4FF; --primary-ring:#D1E0FF;
  --ok:#12B76A; --ok-text:#027A48; --ok-bg:#ECFDF3; --ok-border:#A6F4C5;
  --err:#F04438; --err-text:#B42318; --err-bg:#FEF3F2; --err-border:#FDA29B;
  --info:#2E90FA; --info-text:#175CD3; --info-bg:#EFF8FF; --info-border:#B2DDFF;
  --warn:#F79009; --warn-text:#B54708; --warn-bg:#FFFAEB; --warn-border:#FEDF89;
  --off:#98A2B3; --off-text:#475467; --off-bg:#F2F4F7;
  --err-solid:#D92D20; --err-solid-hover:#B42318;
  --pv-aws:#EC7211; --pv-azure:#0078D4; --pv-gcp:#4285F4; --pv-idc:#344054; --pv-sdu:#7F56D9;
  --white:#FFFFFF;
  --r-card:10px; --r-inner:8px; --r-ctl:8px;
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 32px -8px rgba(16,24,40,.16),0 4px 10px -4px rgba(16,24,40,.08);
  --font-sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-strong);
  font-family:var(--font-sans);font-size:14px;letter-spacing:-0.014em;line-height:1.4;
  -webkit-font-smoothing:antialiased;min-width:1080px}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
/* text-faint(#98A2B3)는 흰 배경에서 2.58:1 — 본문·라벨 텍스트로는 쓰지 않는다.
   허용 용처: 정보를 담지 않는 구분 글리프(breadcrumb "/", head-meta "·", miniflow "→"),
   장식 dot, 아이콘 글리프, 비활성 컨트롤(WCAG 1.4.3 비적용).
   텍스트 역할은 text-weak(4.97:1) 이상만 쓴다. */

svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
svg.ic.sm{width:14px;height:14px;vertical-align:-2px}
svg.ic.xs{width:12px;height:12px;vertical-align:-1px}

.meta{font-size:12px;font-weight:400;color:var(--text-weak);line-height:1.4}
.mono{font-family:var(--font-mono);font-size:12px;color:var(--text-strong)}
.link{color:var(--primary);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}
.muted{color:var(--text-weak)}
.mt-16{margin-top:16px}.mt-12{margin-top:12px}

/* ── App shell ── */
.topnav{height:52px;background:#101828;border-bottom:1px solid #101828;
  display:flex;align-items:stretch;gap:4px;padding:0 24px;position:sticky;top:0;z-index:20}
.topnav .brand{color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;margin-right:20px}
.topnav .brand::before{content:"";width:20px;height:20px;border-radius:6px;flex:none;
  background:linear-gradient(135deg,var(--primary),#7F56D9)}
.topnav .nav-item{color:#98A2B3;font-size:14px;font-weight:500;display:flex;align-items:center;
  padding:0 12px;border-bottom:2px solid transparent;cursor:default}
.topnav .nav-item.active{color:#fff;font-weight:600;border-bottom-color:var(--primary)}
.topnav .nav-item.off{opacity:.5}
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:216px;flex:none;background:#101828;border-right:1px solid #101828;padding:16px 12px}
/* #667085 on #101828 = 3.57:1 (미달) → nav-item과 같은 #98A2B3 = 6.89:1 */
.sidebar .sb-title{font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:8px 10px 10px;color:#98A2B3}
.sidebar .sb-group+.sb-group .sb-title{margin-top:16px}
.sidebar .sb-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;color:#B9C0CC;
  font-size:14px;font-weight:500;margin-bottom:2px}
/* 클릭 가능한 것만 클릭 가능하게 보인다 — hover·pointer는 a에만.
   프로토타입 범위 밖 항목(span)은 hover가 없고 색으로 비활성임을 밝힌다 */
.sidebar a.sb-item{cursor:pointer}
.sidebar a.sb-item:hover{background:#1D2939}
.sidebar span.sb-item{color:#98A2B3;cursor:default}
.sidebar .sb-item.active{background:#1D2939;color:#fff;font-weight:600;
  box-shadow:inset 2px 0 0 var(--primary)}
.sidebar .sb-item .sb-cnt{margin-left:auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--err-solid);color:#fff;border-radius:999px;min-width:20px;height:18px;
  display:inline-grid;place-items:center;padding:0 6px}
.content{flex:1;padding:24px 32px 48px;min-width:0;max-width:1440px}
.breadcrumb{font-size:12px;color:var(--text-weak);margin-bottom:12px}
.breadcrumb .crumb{cursor:pointer}
.breadcrumb .crumb:hover{color:var(--text-medium);text-decoration:underline}
.breadcrumb .sep{margin:0 6px;color:var(--text-faint)}
.breadcrumb .cur{color:var(--text-medium);font-weight:600}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.page-head h1{font-size:24px;font-weight:700;margin:0;line-height:1.2;letter-spacing:-.02em;
  display:flex;align-items:center;gap:10px}
.page-head h1 .h-id{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--text-weak)}
.page-head .head-sub{font-size:14px;color:var(--text-weak);margin-top:8px}
.page-head .actions{display:flex;gap:8px;flex:none}
.page-head.detail-head{padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:0}
.head-meta{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;flex-wrap:wrap}
.head-meta .hm-k{font-size:12px;font-weight:600;color:var(--text-weak)}
.head-meta .hm-v{color:var(--text-strong);font-weight:500;font-variant-numeric:tabular-nums}
.head-meta .hm-sep{color:var(--text-faint)}
.section-title{font-size:20px;font-weight:600;color:var(--text-strong);margin:64px 0 12px;line-height:1.2}
.section-title:first-child{margin-top:0}
.section-desc{font-size:12px;font-weight:400;color:var(--text-weak);line-height:1.4;margin:16px 0 16px}
.subsection-title{font-size:14px;font-weight:600;color:var(--text-medium);margin:16px 0 10px}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-card);
  box-shadow:var(--shadow-xs);padding:20px 24px 24px}
.card+.card{margin-top:16px}
.card .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.card .card-title{font-size:16px;font-weight:600;color:var(--text-strong)}
.card-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.card-grid2>.card+.card{margin-top:0}

/* ── Stat 타일 (클릭 = 필터) ── */
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,260px));gap:12px}
/* 좌측 정렬 — 아래 카드·테이블과 같은 왼쪽 눈금을 공유한다. 가운데 정렬은 타일마다
   눈금이 하나씩 늘어나 스캔 비용만 커진다 (Dannaway: align elements consistently) */
.stat{background:var(--gray-100);border:1px solid var(--border);border-radius:var(--r-card);
  padding:20px 24px 24px;text-align:left;cursor:pointer}
.stat:hover{border-color:var(--border-strong)}
.stat.on{background:var(--bg-card);border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.stat .lbl{font-size:14px;font-weight:600;color:var(--text-medium)}
.stat .val{font-size:32px;font-weight:600;margin-top:12px;line-height:1.2;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .val.v-err{color:var(--err-text)}
.stat .val.v-warn{color:var(--warn-text)}

/* ── 테이블 (admin-pipeline 리듬 th34/td44) ── */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--text-weak);letter-spacing:.03em;
  height:34px;padding:0 12px;border-bottom:1px solid var(--border)}
.tbl td{height:44px;padding:8px 12px;border-bottom:1px solid var(--gray-100);color:var(--text-medium);
  vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--gray-50)}
.tbl .mono{font-family:var(--font-mono);font-size:12px;color:var(--text-strong)}
.tbl td.chev{text-align:right;width:48px;white-space:nowrap;color:var(--text-faint)}
.svc-name{font-weight:600;color:var(--text-strong)}

/* ── Tag / Pill / Provider ── */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  padding:2px 8px;border-radius:6px;vertical-align:middle}
.tag.blue{background:#E8F1FF;color:#1747B5}
.tag.gray{background:var(--gray-100);color:var(--text-medium)}
.tag.green{background:var(--ok-bg);color:var(--ok-text)}
.tag.red{background:var(--err-bg);color:var(--err-text)}
.tag.orange{background:var(--warn-bg);color:var(--warn-text)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  height:20px;padding:0 9px 0 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%}
.pill.t-off{background:var(--off-bg);color:var(--off-text)} .pill.t-off .dot{background:var(--gray-300)}
.pill.t-warn{background:var(--warn-bg);color:var(--warn-text)} .pill.t-warn .dot{background:var(--warn)}
.pill.t-info{background:var(--info-bg);color:var(--info-text)} .pill.t-info .dot{background:var(--info)}
.pill.t-run{background:var(--info-bg);color:var(--info-text)} .pill.t-run .dot{background:var(--info);animation:pulse 1.6s ease-in-out infinite}
.pill.t-ready{background:var(--primary-bg);color:var(--primary)} .pill.t-ready .dot{background:var(--primary)}
.pill.t-ok{background:var(--ok-bg);color:var(--ok-text)} .pill.t-ok .dot{background:var(--ok)}
.pill.t-err{background:var(--err-bg);color:var(--err-text)} .pill.t-err .dot{background:var(--err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ptag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-medium)}
.ptag .pdot{width:8px;height:8px;border-radius:2.5px}

/* ── KeyValueGrid ── */
.kv2{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;font-size:14px}
.kv2 .k{font-size:12px;font-weight:600;color:var(--text-weak);line-height:1.6}
.kv2 .v{color:var(--text-strong);font-weight:500;line-height:1.6;word-break:break-all}
.kv2 .v .mono{font-size:12px}

/* ── Controls ── */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filterbar .spacer{flex:1}
.searchbox{position:relative;display:inline-block}
.searchbox svg.ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;
  color:var(--text-faint);pointer-events:none}
.searchbox .input{padding-left:30px;width:100%}
.input,select.sel{height:32px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);padding:0 10px;
  font-size:14px;font-family:inherit;color:var(--text-strong);background:var(--bg-card);outline:none}
.input:focus,select.sel:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;
  border-radius:var(--r-ctl);font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;
  white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:disabled{cursor:not-allowed}
.btn.primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-xs)}
.btn.primary:not(:disabled):hover{background:var(--primary-hover)}
.btn.primary:disabled{background:var(--gray-100);color:var(--text-faint);box-shadow:none}
.btn.secondary{background:var(--bg-card);color:var(--text-medium);border-color:var(--border-strong);box-shadow:var(--shadow-xs)}
.btn.secondary:not(:disabled):hover{background:var(--gray-50)}
.btn.secondary:disabled{color:var(--text-faint)}
.btn.danger{background:var(--bg-card);color:var(--err-text);border-color:var(--err-border);box-shadow:var(--shadow-xs)}
.btn.danger:not(:disabled):hover{background:var(--err-bg)}
.btn.dangersolid{background:var(--err-solid);color:#fff;box-shadow:var(--shadow-xs)}
.btn.dangersolid:not(:disabled):hover{background:var(--err-solid-hover)}
.btn.dangersolid:disabled{background:var(--gray-100);color:var(--text-faint);box-shadow:none}
.btn.sm{height:28px;padding:0 10px;font-size:12px}

/* ── 지연 표기 — 4단계: 회색(1시간 미만)/노랑(1시간↑)/주황(1일↑)/빨강(7일↑) ──
   색만으로 심각도를 말하지 않는다: 1일↑(d2·d3)에는 경고 글리프가 함께 붙어
   색을 구분하지 못해도 "임계 초과" 경계가 읽힌다 (Dannaway: don't rely on colour alone).
   d2 vs d3 구분은 색이 아니라 본문 숫자(1일 vs 7일↑)가 이미 담당한다. */
.delay{display:inline-flex;align-items:center;gap:4px;
  font-variant-numeric:tabular-nums;font-weight:500;color:var(--text-weak)}
.delay.d1{color:#A16207;font-weight:600}
.delay.d2{color:#C2410C;font-weight:600}
.delay.d3{color:#DC2626;font-weight:700}

/* ── TS 상세: 3-tier 표면 (chrome 다크 · masthead 화이트 · tab rail 틴트 · body 그레이) ── */
.ts-mast{background:var(--bg-card);margin:-24px -32px 0;padding:20px 32px 18px;
  border-bottom:1px solid var(--border)}
.ts-mast .breadcrumb{margin-bottom:10px}
/* 계층 — 크기·굵기·색으로 tier 구분. 2026-07-25: 구 28/18/15/13 4종을 파일 선언 스케일
   {12,14,16,20,24,32}로 흡수 (Dannaway "reduce the number of styles" + style-guide §1
   "크기는 표준 세트에서만"). 이전 값은 app /pass/admin/pipelines 정합용이었으나
   같은 파일 안에 두 개의 타입 스케일이 공존하는 비용이 더 컸다.
   TS id 24/700 gray-900 (최강조) > 서비스명 16/600 gray-900 (강조) > label 12/400 gray-500 > value 14/400 gray-900
   → .page-head h1(24/700) + .h-id(16/600 weak)와 동일 값 = 두 헤더 패턴이 같은 규칙을 쓴다 */
/* 현재 단계 — 타이틀 위 eyebrow */
.mast-eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mast-eyebrow .mp-k{font-size:12px;font-weight:400;color:var(--gray-500)}
.mast-h1{font-size:24px;font-weight:700;margin:0;line-height:1.2;color:var(--gray-900)}
.mast-h1 .tid{font-size:16px;font-weight:600;color:var(--text-weak);margin-left:4px}
/* 3개 정보 그룹 — 카드 아님, 컬럼 + 얇은 구분선으로만 구분 */
.mast-groups{display:flex;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.mast-groups .grp{flex:1;min-width:0;padding:0 28px;border-left:1px solid var(--border)}
.mast-groups .grp:first-child{padding-left:0;border-left:0}
/* grp-title: 구 gray-400 은 흰 배경에서 2.58:1 (4.5:1 미달) — text-weak 4.97:1 로 승격 */
.grp-title{font-size:12px;font-weight:700;color:var(--text-weak);letter-spacing:.02em;margin-bottom:12px}
.grp-body{display:flex;flex-direction:column;gap:10px}
.grp-body .row{display:flex;align-items:center;gap:8px}
.grp-body .svc{font-size:16px;font-weight:600;color:var(--gray-900)}
.grp-body .code{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--gray-700);
  background:var(--gray-100);padding:1px 8px;border-radius:6px}
.grp-body .cell{display:flex;align-items:center;gap:8px}
.grp-body .k{font-size:12px;font-weight:400;color:var(--gray-500);min-width:84px}
.grp-body .v{font-size:14px;font-weight:400;color:var(--gray-900);font-variant-numeric:tabular-nums}
.grp-body .link{font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:2px}
.grp-body .meta{font-size:12px;color:var(--text-weak)}
/* 설치 설정 그룹 — 상태와 진입점만. ARN 전문은 길어서 모달로 내린다 */
.grp-body .srow{display:flex;align-items:center;gap:8px;min-height:20px}
.grp-body .srow .k{min-width:78px;flex:none}
.grp-body .srow .link{font-size:12px}
.jchip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:1px 6px;border-radius:6px}
.jchip:hover{background:var(--gray-50)}
.jchip .mono{font-size:12px;color:var(--primary);font-weight:600}

/* ── 연동 요청 정보: 요청 프로세스 미니 플로우 · 확정 원본 JSON ── */
.miniflow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* 3단(미도달·완료·현재)을 유지하면서 셋 다 4.5:1 통과: weak 4.97 < medium 7.69 < primary 5.17+700 */
.miniflow .mf{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-weak)}
.miniflow .mf .fdot{width:8px;height:8px;border-radius:999px;background:var(--gray-200)}
.miniflow .mf.done{color:var(--text-medium)}
.miniflow .mf.done .fdot{background:var(--primary)}
.miniflow .mf.cur{color:var(--primary);font-weight:700}
.miniflow .mf.cur .fdot{background:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.miniflow .fa{color:var(--text-faint)}
.jsonbox{background:var(--gray-900);color:#D0D5DD;font-family:var(--font-mono);font-size:12px;line-height:1.55;
  border-radius:8px;padding:14px 16px;overflow:auto;max-height:420px;margin:0;white-space:pre}

/* tab rail — 독립 틴트 밴드; 활성 탭만 화이트로 body에 연결 */
.tabbar{display:flex;gap:2px;background:var(--gray-100);border-bottom:1px solid var(--border);
  margin:0 -32px 24px;padding:0 32px}
.tabbar .tab{padding:12px 16px;font-size:14px;font-weight:500;color:var(--text-weak);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:6px 6px 0 0}
.tabbar .tab:hover{color:var(--text-medium);background:var(--gray-50)}
.tabbar .tab.on{color:var(--primary);font-weight:600;border-bottom-color:var(--primary);background:var(--bg-card)}
.tabbar .tab .tmark{display:inline-block;width:6px;height:6px;border-radius:999px;background:var(--warn);
  vertical-align:6px;margin-left:4px}

/* ── Step rail (Process Status 탭) ── */
.steprail{display:flex;align-items:flex-start;margin:8px 0 4px}
.steprail .sp{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.steprail .sp::before{content:"";position:absolute;top:11px;left:calc(-50% + 14px);right:calc(50% + 14px);
  height:2px;background:var(--gray-200)}
.steprail .sp:first-child::before{display:none}
.steprail .sp.done::before,.steprail .sp.cur::before{background:var(--primary)}
/* 미도달 스텝의 번호도 읽을 수 있어야 한다 — faint on gray-100 은 2.34:1, weak 는 4.51:1 */
.steprail .sp .n{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;
  font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--gray-100);color:var(--text-weak);border:1px solid var(--border)}
.steprail .sp.done .n{background:var(--primary);border-color:var(--primary);color:#fff}
.steprail .sp.cur .n{background:var(--bg-card);border:2px solid var(--primary);color:var(--primary)}
/* miniflow와 동일한 3단 대비 규칙 — 미도달도 4.5:1 통과 (구 faint 2.58:1).
   keep-all: 한글이 어절 중간에서 끊기지 않게 ("연동 대상 DB 선 / 택" → "연동 대상 / DB 선택") */
.steprail .sp .t{font-size:12px;font-weight:500;color:var(--text-weak);text-align:center;line-height:1.4;
  max-width:96px;word-break:keep-all}
.steprail .sp.done .t{color:var(--text-medium)}
.steprail .sp.cur .t{color:var(--primary);font-weight:600}

/* ── 권한 체크리스트 (AWS Role 검증) ── */
.check-list{border:1px solid var(--border);border-radius:var(--r-inner);overflow:hidden;margin-top:12px}
.check-list .ck{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14px;
  border-top:1px solid var(--gray-100);color:var(--text-medium)}
.check-list .ck:first-child{border-top:0}
.check-list .ck .mono{flex:1}
/* 아이콘 크기는 16/14/12 세트만 — 호출부가 이미 .sm(14)을 넘기므로 15px 덮어쓰기 제거 */
.check-list .ck.ok svg.ic{color:var(--ok-text)}
.check-list .ck.err{background:var(--err-bg)}
.check-list .ck.err svg.ic{color:var(--err-text)}
.check-list .ck.err .mono{color:var(--err-text)}
.ck-verdict{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:600}
.ck-verdict.ok{color:var(--ok-text)} .ck-verdict.err{color:var(--err-text)}

/* ── 설치 모드 선택 카드 ── */
.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.mode-opt{border:1px solid var(--border-strong);border-radius:var(--r-inner);padding:14px 16px;
  cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--bg-card)}
.mode-opt:hover{background:var(--gray-50)}
.mode-opt.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring);background:var(--primary-bg)}
.mode-opt .radio{width:16px;height:16px;border-radius:999px;border:1.5px solid var(--border-strong);
  flex:none;margin-top:1px;display:grid;place-items:center}
.mode-opt.on .radio{border-color:var(--primary)}
.mode-opt.on .radio::after{content:"";width:8px;height:8px;border-radius:999px;background:var(--primary)}
.mode-opt .mt{font-size:14px;font-weight:600;color:var(--text-strong);display:flex;align-items:center;gap:4px}
/* 모드 설명은 hover(native title)로 — 항상 펼쳐두면 카드가 길어지고, 모드는 한 번 정하면
   거의 안 바뀌는 값이라 상시 노출할 정보가치가 낮다. help 글리프가 hover 가능함을 알린다. */
.mode-opt .help{color:var(--text-faint);cursor:help}

/* ── 모달 폼 계층 4단 ──
   1 제목 16/700 strong · 2 설명 14/400 medium · 3 라벨 12/600 medium · 4 값 14/500 strong
   라벨은 읽기전용 블록 제목과 입력 필드 라벨이 같은 스타일을 쓴다 — 12/600 두 종류를
   색만 다르게 두면 구분이 약하고, 편집 가능 여부는 "배경이 눌려 있는지"가 이미 말한다. */
.f-label{font-size:12px;font-weight:600;color:var(--text-medium);margin-bottom:8px;
  display:flex;align-items:center;gap:4px}
.f-label .req{color:var(--err-text);font-weight:700}
.f-help{font-size:12px;font-weight:400;color:var(--text-weak);margin-top:8px;line-height:1.4}
.f-help.bad{color:var(--err-text);font-weight:500}

/* 읽기 전용 컨텍스트 — disabled 가 아니라 "고칠 대상이 아님". 눌린 배경으로 구분한다
   (ui-ux-pro-max: read-only-distinction) */
.ro-block{background:var(--gray-50);border:1px solid var(--border);
  border-radius:var(--r-inner);padding:12px 16px}
.ro-row{display:flex;align-items:center;gap:12px;min-height:24px}
.ro-row .rk{font-size:12px;font-weight:400;color:var(--text-weak);min-width:64px;flex:none}
.ro-row .rv{font-size:14px;font-weight:500;color:var(--text-strong)}
.ro-row .rv.mono{font-family:var(--font-mono);font-size:12px}

/* Role 이름만 입력 — 계정·partition 은 고정값이라 prefix 로 붙이고 편집 대상에서 뺀다.
   prefix 와 입력값은 하나의 ARN 이므로 색·굵기를 똑같이 둔다(12/400 strong) — 한 문자열이
   두 색으로 갈리면 서로 다른 값처럼 읽힌다. 편집 가능 여부는 색이 아니라 배경(고정=gray-100,
   입력=흰색)·구분선·캐럿이 말한다. placeholder 만 faint 로 낮춰 실제 입력값과 구분한다. */
.arn-field{display:flex;align-items:stretch;border:1px solid var(--border-strong);
  border-radius:var(--r-ctl);overflow:hidden;background:var(--bg-card)}
.arn-field:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.arn-field.bad{border-color:var(--err);box-shadow:0 0 0 3px var(--err-bg)}
.arn-field .pre,.arn-field input{font-family:var(--font-mono);font-size:12px;font-weight:400;
  color:var(--text-strong)}
.arn-field .pre{display:flex;align-items:center;padding:0 2px 0 10px;background:var(--gray-100);
  white-space:nowrap;border-right:1px solid var(--border);user-select:all}
.arn-field input{flex:1;min-width:0;border:0;outline:none;height:32px;padding:0 10px}
.arn-field input::placeholder{color:var(--text-faint)}
/* Role ARN 표시 — 모달 안에서 코드값으로 읽히게 (본문 prose 와 구분) */
.role-arn{font-family:var(--font-mono);font-size:12px;
  color:var(--text-strong);background:var(--gray-50);border:1px solid var(--border);
  border-radius:var(--r-inner);padding:8px 12px;word-break:break-all;margin-bottom:16px}
/* 권한 확인 = 파란색 + 상시 밑줄 (.link 는 hover 시에만 밑줄) */
.link.u{text-decoration:underline}

/* ── 스캔 진행률 ── */
.pbar{height:6px;border-radius:999px;background:var(--gray-200);overflow:hidden;margin-top:8px}
.pbar>i{display:block;height:100%;background:var(--primary);border-radius:999px}
.cnt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:12px}
.cnt-cell{border:1px solid var(--border);border-radius:var(--r-inner);padding:12px}
.cnt-cell .ct{font-size:12px;font-weight:600;color:var(--text-weak)}
.cnt-cell .cv{font-size:20px;font-weight:700;color:var(--text-strong);
  font-variant-numeric:tabular-nums;margin-top:4px}

/* ── 안내/경고 박스 ── */
.note{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-border);
  border-radius:var(--r-inner);padding:10px 12px;font-size:14px;color:var(--text-medium);line-height:1.4}
.note svg.ic{color:var(--warn-text);flex:none;margin-top:1px}
.note.info{background:var(--info-bg);border-color:var(--info-border)}
.note.info svg.ic{color:var(--info-text)}
.note.err{background:var(--err-bg);border-color:var(--err-border)}
.note.err svg.ic{color:var(--err-text)}

/* ── 사용자 칩 (Jira 등록 사용자) ── */
.uchips{display:flex;gap:4px;flex-wrap:wrap}
.uchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;
  background:var(--gray-100);color:var(--text-medium);border-radius:999px;padding:2px 8px}
.uchip::before{content:"";width:5px;height:5px;border-radius:999px;background:var(--gray-400)}

/* ── Modal / Toast ── */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg-card);border-radius:12px;box-shadow:var(--shadow-lg);padding:24px;width:480px}
.modal h3{margin:0 0 12px;font-size:16px;font-weight:700}
.modal .desc{font-size:14px;color:var(--text-medium);margin-bottom:12px;line-height:1.4}
.modal textarea{width:100%;min-height:88px;border:1px solid var(--border-strong);border-radius:var(--r-ctl);
  padding:8px 10px;font-size:14px;font-family:inherit;resize:vertical;outline:none;line-height:1.4}
.modal textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.modal label.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--text-medium);
  padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-inner);cursor:pointer;margin-top:12px}
.modal label.chk input{margin-top:2px;accent-color:var(--err-solid)}
.modal label.chk b{color:var(--err-text)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gray-900);
  color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);
  z-index:60;display:flex;align-items:center;gap:8px}
.toast svg.ic{color:var(--ok)}
.empty{text-align:center;padding:32px;color:var(--text-weak);font-size:14px;line-height:1.4}
.detail-link{display:inline-flex;align-items:center;gap:4px;color:var(--primary);font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
.detail-link:hover{text-decoration:underline}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function icon(name, cls){
  const paths = {
    search:'<circle cx="7" cy="7" r="5"/><path d="m14 14-3.2-3.2"/>',
    check:'<path d="M13.5 4.5 6.5 11.5 2.5 7.5"/>',
    x:'<path d="M12 4 4 12M4 4l8 8"/>',
    alert:'<path d="M8 5.5v3.5"/><circle cx="8" cy="11.5" r=".5"/><path d="M8 1.8 1.6 13.2h12.8L8 1.8z"/>',
    info:'<circle cx="8" cy="8" r="6.4"/><path d="M8 7.5v3.4"/><circle cx="8" cy="5.2" r=".5"/>',
    refresh:'<path d="M13.6 8a5.6 5.6 0 1 1-1.7-4L14 6"/><path d="M14 2v4h-4"/>',
    chev:'<path d="m6 3.5 4.5 4.5L6 12.5"/>',
    open:'<path d="M6.5 3.5H3.2A1.2 1.2 0 0 0 2 4.7v8.1A1.2 1.2 0 0 0 3.2 14h8.1a1.2 1.2 0 0 0 1.2-1.2V9.5"/><path d="M9.5 2H14v4.5"/><path d="M14 2 7.5 8.5"/>',
    play:'<path d="M4.5 3.2v9.6L13 8 4.5 3.2z"/>',
    trash:'<path d="M2.5 4.5h11M6.5 4.5V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M4 4.5l.7 8.3a1.2 1.2 0 0 0 1.2 1.1h4.2a1.2 1.2 0 0 0 1.2-1.1l.7-8.3"/>',
    plus:'<path d="M8 3.2v9.6M3.2 8h9.6"/>',
  };
  return `<svg class="ic ${cls||''}" viewBox="0 0 16 16">${paths[name]||''}</svg>`;
}
function pill(st){ const s=STEP[st]; return `<span class="pill ${s.tone}"><span class="dot"></span>Step ${s.n} · ${s.label}</span>`; }
function ptag(pv){ return `<span class="ptag"><span class="pdot" style="background:${PROVIDERS[pv].color}"></span>${pv}</span>`; }
const DELAY_TIER = [
  {min:604800, cls:'d3', warn:true,  title:'7일 이상 정체'},
  {min:86400,  cls:'d2', warn:true,  title:'1일 이상 정체'},
  {min:3600,   cls:'d1', warn:false, title:'1시간 이상 경과'},
  {min:0,      cls:'',   warn:false, title:'1시간 미만'},
];
function delayCell(sec){
  const tier = DELAY_TIER.find(x=>sec>=x.min);
  const h = Math.floor(sec/3600), d = Math.floor(h/24);
  const txt = d>0?`${d}일 ${h%24}시간`:h>0?`${h}시간`:`${Math.floor(sec/60)}분`;
  return `<span class="delay ${tier.cls}" title="${tier.title}">${tier.warn?icon('alert','xs'):''}${txt}</span>`;
}
function toast(msg){
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast">${icon('check')}${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(()=>root.innerHTML='', 2600);
}

/* ── masthead 헬퍼: 서비스 메타는 헤더로 승격, 상세는 진행 상태 탭 ── */
const META_LABELS = {
  awsAccountId:'AWS Account', awsRegion:'Region', regionType:'Region Type',

  host:'Host', ips:'IP', oracleSid:'Oracle SID', nlbIndex:'NLB Index',
  sduType:'SDU Type', sduCluster:'SDU Cluster',
};
function kv(k,v){ return `<div class="k">${esc(k)}</div><div class="v">${v}</div>`; }
function providerMetaChips(t){
  return Object.keys(t.meta||{}).map(k=>
    `<div class="cell"><span class="k">${esc(META_LABELS[k]||k)}</span><span class="v">${esc(t.meta[k])}</span></div>`).join('');
}
function stepRail(t){
  const cur = STEP[t.st];
  return `<div class="steprail">
    ${STEP_ORDER.map(k=>{const s=STEP[k];
      const cls = s.n<cur.n?'done':s.n===cur.n?'cur':'';
      return `<div class="sp ${cls}"><div class="n">${s.n<cur.n?icon('check','xs'):s.n}</div><div class="t">${s.label}</div></div>`;}).join('')}
  </div>`;
}
function jiraChip(j){
  if(!j) return '<span class="muted">미연결</span>';
  return `<span class="jchip" title="${esc(j.summary)}" onclick="toast('Jira로 이동합니다 (프로토타입)')"><span class="mono">${esc(j.key)}</span></span>`;
}
/* 승인 요청 상태 — install-v1 ApprovalRequest enum 정합 */
const APPROVAL_TAG = {PENDING:'orange', APPROVED:'green', AUTO_APPROVED:'green',

      ${t.approvals && t.approvals.length?`<table class="tbl">

/* ── 탭: 연동 요청 정보 (최근 승인 요청 · 요청 프로세스 · 승인↔확정 diff) ── */
const REQ_FLOW = ['연동 요청','관리자 승인','반영중','확정'];
function latestApproval(t){ return (t.approvals && t.approvals[0]) || null; }
function reqFlowHtml(t){
  const a = latestApproval(t);
  if(!a) return '';
  if(['REJECTED','CANCELLED','UNAVAILABLE','UNAVAILABLE_ACKNOWLEDGED'].includes(a.status))
    return `<div class="note err" style="margin-top:12px">${icon('alert')}<div>최근 요청이 <b>${esc(a.status)}</b> 처리되어 연동 요청 프로세스가 종료되었습니다. 연동을 계속하려면 재요청이 필요합니다.</div></div>`;
  const done = t.confirmed?4 : ['APPROVED','AUTO_APPROVED'].includes(a.status)?2 : 1;
  return `<div class="miniflow" style="margin-top:12px">
    ${REQ_FLOW.map((l,i)=>{
      const cls = i<done?'done':i===done?'cur':'';
      return `${i?'<span class="fa">→</span>':''}<span class="mf ${cls}"><span class="fdot"></span>${l}</span>`;
    }).join('')}
  </div>`;
}
/* 승인 Set ↔ 확정 Set 비교 (양쪽 리소스 목록이 있을 때만) */
function confirmDiff(t){
  const a = latestApproval(t);
  const ar = (a && a.resources)||[], cr = (t.confirmed && t.confirmed.resources)||[];
  if(!ar.length || !cr.length) return null;
  const aIds = new Set(ar.map(r=>r.rid)), cIds = new Set(cr.map(r=>r.rid));
  return {
    common:  ar.filter(r=>cIds.has(r.rid)),
    removed: ar.filter(r=>!cIds.has(r.rid)),
    added:   cr.filter(r=>!aIds.has(r.rid)),
  };
}
function resourceRows(list, badge){
  return list.map(r=>`<tr>
    <td><span class="mono">${esc(r.rid)}</span></td>
    <td class="svc-name">${esc(r.name)}</td>
    <td><span class="tag gray">${esc(r.type)}</span></td>
    ${badge?`<td>${badge(r)}</td>`:''}
  </tr>`).join('');
}
function tabConfirm(t){
  const a = latestApproval(t);
  const d = confirmDiff(t);
  const approved = a && ['APPROVED','AUTO_APPROVED'].includes(a.status);
  const hasDiff = d && (d.removed.length || d.added.length);
  return `
    <div class="card">
      <div class="card-head"><div class="card-title">최근 연동 승인 요청</div></div>
      ${a?`<div class="kv2">
        ${kv('요청 ID', `<span class="mono">${esc(a.id)}</span>`)}
        ${kv('상태', approvalTag(a.status))}
        ${kv('요청자', esc(a.by))}
        ${kv('요청 일시', a.at)}
        ${kv('처리', a.result?`${esc(a.result.by)} <span class="meta">${a.result.at}</span>`:'<span class="muted">—</span>')}
        ${kv('승인 대상', `${a.resourceCount}개`)}
      </div>
      <div class="subsection-title" style="margin-top:16px">연동 요청 프로세스</div>
      ${reqFlowHtml(t)}`
      :`<div class="empty">승인 요청 이력이 없습니다.</div>`}
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">확정 정보</div>
        <div style="display:flex;gap:8px">
          ${t.confirmed&&d?`<button class="btn secondary sm" onclick="openDiffModal(${t.id})">승인·확정 차이 보기</button>`:''}
          ${t.confirmed&&t.confirmed.raw?`<button class="btn secondary sm" onclick="openRawModal(${t.id})">원본 JSON</button>`:''}
          ${t.confirmed?`<button class="btn danger sm" onclick="openDeleteConfirmedModal(${t.id})">${icon('trash','xs')}확정 정보 삭제</button>`:''}
        </div>
      </div>
      ${t.confirmed?`
        <div class="kv2">
          ${kv('확정 리소스', `${t.confirmed.dbCount}개`)}
          ${kv('확정 일시', t.confirmed.at)}
        </div>
        ${d?(hasDiff
          ?`<div class="note" style="margin-top:16px">${icon('alert')}<div>승인 정보와 확정 정보의 리소스 Set이 다릅니다 — 공통 <b>${d.common.length}</b> · 확정에서 제외 <b>${d.removed.length}</b> · 승인 외 추가 <b>${d.added.length}</b> <span class="link" onclick="openDiffModal(${t.id})">차이 보기</span></div></div>`
          :`<div class="note info" style="margin-top:16px">${icon('info')}<div>승인 정보와 동일한 리소스 Set으로 확정되었습니다.</div></div>`):''}
        ${t.confirmed.resources?`
        <div class="subsection-title" style="margin-top:16px">확정 리소스 목록</div>
        <table class="tbl">
          <thead><tr><th>Resource ID</th><th>이름</th><th>유형</th><th></th></tr></thead>
          <tbody>${resourceRows(t.confirmed.resources, r=>{
            if(!a || !a.resources) return '';
            return a.resources.some(x=>x.rid===r.rid)?'':'<span class="tag orange">승인 외 추가</span>';
          })}</tbody>
        </table>`:''}`
      : approved && a.resources ? `
        <div class="note info">${icon('info')}<div>확정 정보가 아직 생성되지 않았습니다. <b>승인 정보 기준 예상 확정 정보</b>입니다. 실제 확정 입력에는 조회 API에 노출되지 않는 운영 변수가 추가로 필요합니다.</div></div>
        <div class="subsection-title" style="margin-top:16px">예상 확정 리소스 <span class="meta">승인 ${esc(a.id)} 기준 ${a.resources.length}개</span></div>
        <table class="tbl">
          <thead><tr><th>Resource ID</th><th>이름</th><th>유형</th></tr></thead>
          <tbody>${resourceRows(a.resources)}</tbody>
        </table>`
      : `<div class="empty">확정된 연동 정보가 없습니다.${a&&a.status==='PENDING'?'<br><span class="meta">승인 완료 후 확정 정보가 생성됩니다.</span>':''}</div>`}
    </div>

    <div class="card mt-16">
      <div class="card-head"><div class="card-title">확정 정보 삭제 Policy</div></div>
      <div class="section-desc" style="margin-top:0">삭제 실행 전 아래 정책이 적용됩니다. 정책은 서버에서 조회한 값입니다.</div>
      <div class="kv2">
        ${kv('재승인 필요', '<span class="tag orange">필요</span> — 삭제 후 연동 재개 시 승인 절차를 처음부터 다시 진행')}
        ${kv('파이프라인 영향', '진행 중인 설치 파이프라인이 있으면 삭제 불가 (취소 후 가능)')}
        ${kv('보존 기간', '삭제 후 30일간 이력 보존, 이후 영구 삭제')}
        ${kv('연결 테스트 결과', '삭제 시 함께 무효화')}
      </div>
    </div>`;
}
function openDeleteConfirmedModal(id){
  const t = tsOf(id);
  const running = t.pipelines.some(p=>p.st==='RUNNING');
  openModal(`
    <h3>확정 정보 삭제 — <span class="mono" style="font-size:14px">#${t.id}</span></h3>
    <div class="desc">확정 DB ${t.confirmed.dbCount}개의 연동 확정 정보를 삭제합니다. 삭제 후 재연동 시 승인 절차를 다시 진행해야 합니다.</div>
    ${running?`<div class="note err">${icon('alert')}<div>진행 중인 파이프라인이 있습니다. 정책상 삭제할 수 없습니다 — 파이프라인 취소 후 다시 시도하세요.</div></div>`:''}
    <div class="subsection-title">삭제 사유 (필수)</div>
    <textarea id="del-reason" placeholder="예: 잘못된 대상 DB 확정으로 재승인 진행"></textarea>
    <div class="foot">
      <button class="btn secondary" onclick="closeModal()">취소</button>
      <button class="btn dangersolid" ${running?'disabled':''} onclick="doDeleteConfirmed(${t.id})">삭제</button>
    </div>`);
}
function doDeleteConfirmed(id){
  const v = document.getElementById('del-reason').value.trim();

const ROLE_REQUIRED_PERMS = {

/* 권한 확인 모달 — 계약이 주는 판정(status·fail_reason·fail_message·last_verified_at) +

function openRoleVerifyModal(id, key){
  const t = tsOf(id), r = t[key], m = ROLE_META[key], ok = r.status==='COMPLETED';

        <span class="rv">${esc(r.lastVerifiedAt||'-')}</span></div>

    <div class="subsection-title">필요 권한 <span class="meta">이 Role에 부여돼야 하는 항목 — 검증 API는 권한별 결과를 주지 않습니다</span></div>
    <div class="check-list">
      ${ROLE_REQUIRED_PERMS[key].map(p=>`<div class="ck"><span class="mono">${p}</span></div>`).join('')}
    </div>

      <button class="btn primary" onclick="verifyRole(${id},'${key}')">${icon('refresh','xs')}다시 검증</button>
    </div>`, 560);

/* ARN 은 계정 ID + partition + Role 이름으로 결정된다. 앞의 둘은 TS 메타에서 이미
   아는 고정값이라 운영자가 다시 타이핑할 이유가 없다 — 이름만 받아 조립한다.
   China 리전은 partition 이 aws-cn — 이걸 틀리면 ARN 자체가 무효가 된다. */
function awsPartition(t){ return isChina(t) ? 'aws-cn' : 'aws'; }
function isChina(t){ return (t.meta && t.meta.regionType) === 'China'; }
function arnPrefix(t){ return `arn:${awsPartition(t)}:iam::${(t.meta&&t.meta.awsAccountId)||''}:role/`; }
function roleNameOf(arn){ const i = arn ? arn.indexOf(':role/') : -1; return i<0 ? '' : arn.slice(i+6); }
/* IAM Role 이름 규칙: 영숫자와 +=,.@-_ , 최대 64자 */
const ROLE_NAME_RE = /^[\w+=,.@-]{1,64}$/;

function openRoleEditModal(id, key){
  const t = tsOf(id), r = t[key] || {}, m = ROLE_META[key];
  openModal(`
    <h3>${m.title} ${r.arn?'수정':'등록'}</h3>
    <div class="desc">${m.desc}. Role <b>이름</b>만 입력하면 아래 계정 정보로 ARN을 만듭니다.</div>
    <div class="ro-block">
      <div class="f-label">대상 계정 ${icon('info','xs')}</div>
      <div class="ro-row"><span class="rk">AWS 계정</span>
        <span class="rv mono">${esc((t.meta&&t.meta.awsAccountId)||'-')}</span></div>
      <div class="ro-row"><span class="rk">리전</span>
        <span class="rv">${esc((t.meta&&t.meta.regionType)||'-')}</span>
        ${isChina(t)?'<span class="tag orange">aws-cn partition</span>':''}</div>
    </div>
    <div style="margin-top:24px">
      <label class="f-label" for="role-name-input">Role 이름 <span class="req">*</span></label>
      <div class="arn-field" id="arn-field">
        <span class="pre">${esc(arnPrefix(t))}</span>
        <input id="role-name-input" spellcheck="false" autocomplete="off"
          placeholder="${esc(m.sample)}" value="${esc(roleNameOf(r.arn))}" oninput="validateRoleName()">
      </div>
      <div class="f-help" id="role-name-help"></div>
    </div>
    <div class="foot">
      <button class="btn secondary" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="saveRole(${id},'${key}')">저장</button>
    </div>`, 560);
  validateRoleName();
  document.getElementById('role-name-input').focus();
}
/* 헬퍼는 상시 표시(input-helper-text) — 규칙을 placeholder 로만 알리지 않는다.
   위반 시 같은 자리에서 에러로 바뀐다(error-placement: 필드 바로 아래) */
const ROLE_NAME_HELP = '영숫자와 + = , . @ - _ 를 쓸 수 있고 최대 64자입니다.';
function validateRoleName(){
  const inp = document.getElementById('role-name-input');
  const help = document.getElementById('role-name-help');
  const name = inp.value.trim();
  const bad = !!name && !ROLE_NAME_RE.test(name);
  document.getElementById('arn-field').classList.toggle('bad', bad);
  help.className = 'f-help' + (bad?' bad':'');
  help.textContent = bad
    ? (name.length>64 ? `이름이 ${name.length}자입니다 — 최대 64자까지 쓸 수 있습니다.`
                      : '쓸 수 없는 문자가 있습니다. ' + ROLE_NAME_HELP)
    : ROLE_NAME_HELP;
  return !bad && !!name;
}
function saveRole(id, key){
  const t = tsOf(id);
  const inp = document.getElementById('role-name-input');
  const name = inp.value.trim();
  if(!validateRoleName()){ inp.focus(); toast(name?'Role 이름 형식을 확인하세요':'Role 이름을 입력하세요'); return; }
  /* 새 ARN 은 아직 검증되지 않은 상태 — 이전 판정을 물려주면 안 된다 */
  t[key] = {arn:arnPrefix(t)+name, status:'IN_PROGRESS', failReason:null, failMessage:null, lastVerifiedAt:null};
  closeModal(); toast('Role을 저장했습니다. 권한 검증을 실행합니다…');
  reRenderTs(id);
  setTimeout(()=>verifyRole(id,key,true), 900);
}
function verifyRole(id, key, silent){
  if(!silent){ closeModal(); toast('권한 검증을 요청했습니다…'); }
  const t = tsOf(id);
  setTimeout(()=>{
    t[key].status='COMPLETED'; t[key].failReason=null; t[key].failMessage=null;
    t[key].lastVerifiedAt='방금';
    toast('권한 검증 결과를 갱신했습니다'); reRenderTs(id);
  }, 900);
}

/* ── 탭: 스캔 ──
   계약: POST /scan · GET /scanJob/latest (ScanJobResponse) · GET /scan/history.
   정책은 app lib/constants/scan.ts SCAN_POLICY 와 같은 값 — IDC 는 자동 스캔 미지원. */
const SCAN_POLICY = {
  AWS:  {enabled:true,  types:['RDS','RDS_CLUSTER','DYNAMODB','ATHENA','REDSHIFT','EC2']},
  AZURE:{enabled:true,  types:['AZURE_MSSQL','AZURE_POSTGRESQL','AZURE_MYSQL','AZURE_MARIADB','AZURE_COSMOS_NOSQL','AZURE_SYNAPSE','AZURE_VM']},
  GCP:  {enabled:true,  types:['CLOUD_SQL','BIGQUERY']},
  IDC:  {enabled:false, reason:'IDC 인프라는 description 식별자 기반으로 등록되며 자동 스캔을 지원하지 않습니다.'},
};
const SCAN_TONE  = {SUCCESS:'green', FAIL:'red', SCANNING:'blue', TIMEOUT:'orange', CANCELED:'gray'};
const SCAN_LABEL = {SUCCESS:'성공', FAIL:'실패', SCANNING:'스캔 중', TIMEOUT:'시간 초과', CANCELED:'취소됨'};
const SCAN_ERROR_LABEL = {
  AUTH_PERMISSION_ERROR:'권한 부족 — Scan Role 권한을 확인하세요',
  RATE_LIMIT:'클라우드 API 호출 한도 초과 — 잠시 후 재시도하세요',
  NETWORK_ERROR:'네트워크 오류 — VPC Endpoint·경로를 확인하세요',
  SERVICE_ERROR:'클라우드 서비스 오류',
  UNKNOWN:'원인 미확인',
};
/* SDU 는 표기값이므로 하부 CSP 로 정책을 조회한다 */
function scanPolicyOf(t){ return SCAN_POLICY[t.csp || t.pv] || {enabled:false, reason:'이 Provider의 스캔 정책이 정의되지 않았습니다.'}; }

function tabScan(t){
  const pol = scanPolicyOf(t);
  if(!pol.enabled) return `<div class="card"><div class="note info">${icon('info')}<div>${esc(pol.reason)}</div></div></div>`;
  const s = t.scan, running = s && s.status==='SCANNING';
  return `
    <div class="card">
      <div class="card-head">
        <div class="card-title">최근 스캔</div>
        <button class="btn ${running?'secondary':'primary'} sm" ${running?'disabled':''} onclick="startScan(${t.id})">
          ${icon(running?'refresh':'play','xs')}${running?'스캔 진행 중':'스캔 실행'}</button>
      </div>
      ${!s?`<div class="empty">스캔을 실행한 적이 없습니다.</div>`:`
        <div class="kv2">
          ${kv('상태', `<span class="tag ${SCAN_TONE[s.status]||'gray'}">${SCAN_LABEL[s.status]||esc(s.status)}</span>`)}
          ${kv('스캔 버전', `v${s.version}`)}
          ${kv('시작', esc(s.at))}
          ${kv('소요', s.durationSec!=null?`${s.durationSec.toFixed(1)}초`:'<span class="muted">-</span>')}
        </div>
        ${running?`<div class="pbar"><i style="width:${s.progress}%"></i></div>
          <div class="meta" style="margin-top:4px">${s.progress}% 진행 — 최대 10초 후 시간 초과 처리됩니다</div>`:''}
        ${s.error?`<div class="note err" style="margin-top:16px">${icon('alert')}<div>
          <b>${esc(s.error)}</b> — ${esc(SCAN_ERROR_LABEL[s.error]||'')}</div></div>`:''}
        ${s.status==='TIMEOUT'?`<div class="note" style="margin-top:16px">${icon('alert')}<div>스캔이 제한 시간 내에 끝나지 않았습니다. 리소스 수가 많거나 클라우드 응답이 느린 경우 발생합니다.</div></div>`:''}
        ${s.counts?`
          <div class="subsection-title">리소스 유형별 개수</div>
          <div class="cnt-grid">
            ${Object.keys(s.counts).map(k=>`<div class="cnt-cell"><div class="ct">${esc(k)}</div><div class="cv">${s.counts[k]}</div></div>`).join('')}
          </div>
          <div class="meta" style="margin-top:8px">합계 ${Object.values(s.counts).reduce((a,b)=>a+b,0)}건 · 승인 요청은 최대 10건까지 선택할 수 있습니다</div>`:''}
      `}
      <div class="subsection-title">스캔 대상 유형 <span class="meta">이 Provider에서 탐색하는 리소스 종류</span></div>
      <div class="meta">${pol.types.join(' · ')}</div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">스캔 이력</div></div>
      <table class="tbl">
        <thead><tr><th style="width:80px">버전</th><th style="width:110px">상태</th><th>시각</th>
          <th style="width:90px">소요</th><th style="width:90px">리소스</th><th>오류</th></tr></thead>
        <tbody>
          ${(t.scanHistory||[]).map(h=>`<tr>
            <td>v${h.version}</td>
            <td><span class="tag ${SCAN_TONE[h.status]||'gray'}">${SCAN_LABEL[h.status]||esc(h.status)}</span></td>
            <td>${esc(h.at)}</td>
            <td>${h.durationSec!=null?h.durationSec.toFixed(1)+'초':'-'}</td>
            <td>${h.total}건</td>
            <td>${h.error?`<span class="mono" style="font-size:12px;color:var(--err-text)">${esc(h.error)}</span>`:'<span class="muted">-</span>'}</td>
          </tr>`).join('') || `<tr><td colspan="6"><div class="empty">스캔 이력이 없습니다.</div></td></tr>`}
        </tbody>
      </table>
    </div>`;
}
function startScan(id){
  const t = tsOf(id);
  /* 계약: 이미 SCANNING 이면 POST /scan 은 409 Conflict */
  if(t.scan && t.scan.status==='SCANNING'){ toast('이미 스캔이 진행 중입니다 (409)'); return; }
  const version = (t.scan?t.scan.version:0) + 1;
  t.scan = {id:Date.now()%100000, status:'SCANNING', version, progress:0, durationSec:null,
    at:'방금', updatedAt:'방금', error:null, counts:null};
  renderTs(id,'scan'); toast('스캔을 시작했습니다');
  const tick = setInterval(()=>{
    if(t.scan.status!=='SCANNING'){ clearInterval(tick); return; }
    t.scan.progress = Math.min(100, t.scan.progress + 25);
    if(t.scan.progress>=100){
      clearInterval(tick);
      const types = scanPolicyOf(t).types;
      t.scan.status='SUCCESS'; t.scan.durationSec=7.2;
      t.scan.counts = {[types[0]]:2, [types[1]]:1};
      t.scanHistory = [{version, status:'SUCCESS', at:'방금', durationSec:7.2, total:3, error:null},
        ...(t.scanHistory||[])];
      toast('스캔이 완료되었습니다');
    }
    if(location.hash===`#/ts/${id}/scan`) renderTs(id,'scan');
  }, 700);
}

/* ── 탭: GCP / Azure / IDC ── */
function tabGcp(t){
  return `
    <div class="card">
      <div class="card-head"><div class="card-title">Service Account</div></div>
      <div class="kv2">
        ${kv('Scan SA', `<span class="mono">${esc(t.gcp.scanSa)}</span>`)}
        ${kv('Terraform SA', `<span class="mono">${esc(t.gcp.tfSa)}</span>`)}
        ${kv('Project', `<span class="mono">${esc(t.meta.gcpProjectId)}</span>`)}
      </div>
      <div class="note info mt-12">${icon('info')}<div>GCP Service Account는 설치 파이프라인에서 자동 생성·바인딩됩니다. 이 화면은 조회 전용입니다.</div></div>
    </div>`;
}
function tabAzure(t){
  return `
    <div class="card">
      <div class="card-head">
        <div class="card-title">Scan App</div>
        <button class="btn secondary sm" onclick="toast('Private Link 헬스체크를 실행했습니다')">${icon('refresh','xs')}Private Link 헬스체크</button>
      </div>
      <div class="kv2">
        ${kv('Scan App ID', `<span class="mono">${esc(t.meta.scanAppId)}</span>`)}
        ${kv('Subscription', `<span class="mono">${esc(t.meta.subscriptionId)}</span>`)}
        ${kv('Resource Group', `<span class="mono">${esc(t.meta.resourceGroup)}</span>`)}
      </div>
    </div>`;
}
function tabIdc(t){
  return `
    <div class="card">
      <div class="card-head"><div class="card-title">NLB · 접속 정보</div></div>
      <div class="kv2">
        ${kv('NLB Index', `<span class="mono">${t.meta.nlbIndex}</span>`)}
        ${kv('Host', `<span class="mono">${esc(t.meta.host)}</span>`)}
        ${kv('IP 목록', `<span class="mono">${esc(t.meta.ips)}</span>`)}
        ${kv('Oracle SID', `<span class="mono">${esc(t.meta.oracleSid)}</span>`)}
      </div>
      <div class="note mt-12">${icon('alert')}<div>IDC는 자동 설치를 지원하지 않습니다. 설치 인력이 접속 정보로 직접 설치 후 완료 처리합니다.</div></div>
    </div>`;
}

/* ══════════ 라우터 ══════════ */
function route(){
  const [, page, a, b] = location.hash.split('/');
  renderSidebar();
  window.scrollTo(0,0);
  closeModal();
  if(page==='services') return renderServices();
  if(page==='svc')      return renderService(a);
  if(page==='ts' && a)  return renderTs(a, b);
  if(page==='ts')       return renderTsSearch();
  return renderAlerts();
}
window.addEventListener('hashchange', route);
if(!location.hash) location.hash = '#/alerts';
route();
</script>
</body>
